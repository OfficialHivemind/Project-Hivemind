# EVERY BEE TYPE IN THE GAME, its rarity and its colour: what the bee menu's
# rows are read against (vision/beemenu) and what the hive is judged with
# (brain/hivejudge).
#
# SOURCE, read 2026-10-01 through the wiki's API (the pages themselves answer
# HTTP 402): the rarity tab pages Bees/Common, Bees/Rare, Bees/Epic,
# Bees/Legendary, Bees/Mythic and Bees/Event, and the colour categories
# Category:Red, Category:Blue and Category:Colorless. The Bees page says
# "There are currently 46 bee types", and the six rarity pages list 46:
# 1 + 9 + 11 + 8 + 6 + 11. The three colour categories hold the same 46
# (11 red, 11 blue, 24 colourless).
#
# `label` is the menu's spelling ("Bubble Bee"); the key is its first word.
source: https://bee-swarm-simulator.fandom.com/wiki/Bees (and the pages above)
checked: 2026-10-01
