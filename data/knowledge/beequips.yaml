# ------------------------------------------------------------- mechanics ---
mechanics:
  storage:
    case: "Beequip Case: 5 slots at start, up to 15. Dapper Bear quests add slots (10th slot at Dapper quest 10); slots 14-15 need Bee Bear's 2020 Beesmas quest. Only beequips IN THE CASE can be equipped. AG: most players have 13."
    storage: "Beequip Storage building (row by the hive pads / near Dandelion; prompt 'Open Beequip Storage', seen live 2026-09-22): 10 slots default, up to 100 for 123,500 tickets total (summary)."
    inbox: "Inbox holds the 25 most recent new beequips; each is DELETED after 48h unless moved to case/storage (data/economy/expiries.yaml beequip_inbox, verified: false)."
    confidence: summary
  equip_rules: "Each beequip has a minimum bee level, often a bee colour or a list of allowed bee types / rarities / gifted-only, and a per-hive equip limit (1-3 of the same beequip). One beequip per bee."
  potential: "0-5 stars, fixed per item. Higher potential = better base stat rolls (weighted) and better wax outcomes. 'Weight' in the community spreadsheet is not 'chance' (AG). Exact effect on waxing: unverified."
  stats_value: "AG values beequips by sign value (trading); stats range 0 to ~50 'val' each. Green [HB]/hive-wide stats are multiplicative."
  waxes:
    limit: "Up to 5 waxes per beequip; Turpentine resets so more can be applied."
    soft:      {power: 1, success: 1.00, on_fail: "-", recipe: "Blender: 5 Honeysuckle, 1 Oil, 1 Enzymes, 10 Royal Jelly", confidence: summary}
    hard:      {power: 2, success: 0.60, on_fail: "wax used up, slot spent, no gain", recipe: "Blender: 3 Soft Wax, 3 Enzymes, 33 Bitterberry, 33 Royal Jelly", confidence: summary}
    caustic:   {power: 4, success: 0.25, on_fail: "DESTROYS THE BEEQUIP", recipe: "Blender: 5 Hard Wax, 5 Enzymes, 25 Neonberry, 5,252 Royal Jelly; also Mythic/Legendary Puffshroom drop, level-17 Snowbear, Tropical Gift Box, long planters", note: "On success also unlocks the {CAUSTIC} stat (e.g. Lip Balm Gold Bubble Pollen, Bead Lizard Token Link)", confidence: summary}
    swirled:   {power: 0, success: 1.00, effect: "Rerolls all base stats (re-applies earlier successful wax bonuses)", recipe: "Blender: 3 Hard Wax, 9 Soft Wax, 6 Purple Potion, 3,333 Royal Jelly; Crafty Gift Box 11th; Beesmas bundles", confidence: summary}
    turpentine: {effect: "Removes ALL waxes (stats back to original), frees the 5 slots", cap: "25 held max", note: "Meta Bee: only worth it with a Planter of Plenty (Turpentine source); recipe not read", confidence: summary}
    strategy: "Meta Bee: conservative 5 Soft; balanced 3 Hard then 2 Soft; aggressive 1 Caustic first then 2 Hard + 2 Soft. Never more than one Caustic on a beequip. H4 RULE: the bot never applies Caustic without the owner's OK (destroys the item 75% of the time)."
  dapper_shop: "Dapper Bear's Shop (behind the Brave Bee Gate; Propeller Hat + Hiking Boots, which the owner has) sells planters and 6 beequips; beequips 3-6 unlock with Dapper Bear quest counts. Which 6, and prices: UNVERIFIED (not read)."

