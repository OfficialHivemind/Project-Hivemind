# ------------------------------------------------------------- rankings ----
# Per hive colour, best first. `wearers` = which bee wears it (not `on`: YAML reads that key as True) (bee_types keys);
# several = spread across those bees. Blue order = AG 'mandatory' then
# 'recommended' then 'optional', and on Diamonds by AG's CA% placement
# (Rose Headband >> Candy Ring > Snow Tiara > Elf Caps = Tree Hats > Sunhat;
# the best CA% item goes on the most-mutated Diamond nearest the balloon).
# AG's "Run on:" bee icons did not survive the save; `wearers` is the item's
# allowed list cut to the bees a blue hive runs (inferred, marked).
rankings:
  blue:
    - {beequip: pinecone, count: 2, wearers: [bear, bucko, bumble], why: "Most important blue beequip: +15-19% Pine capacity, main field Pine Tree. BAR roll -> Bear (AG). Beesmas/trade only."}
    - {beequip: camphor_lip_balm, wearers: [bubble, cool], why: "Most impactful fill beequip: 13-20% Bubble Pollen (+Gold Bubble with Caustic). Buyable; first target for this account."}
    - {beequip: candy_ring, wearers: [diamond], why: "Largest Honey-at-Hive source (5-10%) + 40-50% CA; Diamond #2 by CA%. Buyable/challenge drop."}
    - {beequip: rose_headband, wearers: [diamond], why: "Highest CA% of any beequip (60-80%), 'a condensed Diamond'; goes on the best Diamond. Buyable / Red Clay Planter."}
    - {beequip: elf_cap, count: 2, wearers: [diamond], why: "HaH + Convert-at-Hive; do not run without HaH (AG). Beesmas only."}
    - {beequip: snow_tiara, wearers: [diamond], why: "Blue + White field capacity and CA; GIFTED Diamond. Beesmas only."}
    - {beequip: reindeer_antlers, wearers: [puppy], why: "Focus + Reindeer Fetch (1.1x cap) lets you drop a Focus producer; without it only run Puppy past lvl 16. Beesmas only."}
    - {beequip: toy_drum, wearers: [bucko], why: "Guaranteed Haste + Bee Ability Pollen. Beesmas only."}
    - {beequip: autumn_sunhat, wearers: [diamond], why: "White field cap + CA + 10-15% BAR; needs lvl 16."}
    - {beequip: bead_lizard, wearers: [stubborn, cool], why: "Token Link (Caustic) + Bubble Pollen + Gather Bubble Chance; common/rare bee (AG: Stubborn when Pink Shades takes its spot)."}
    - {beequip: beret, count: 2, wearers: [cool, bumble], why: "Cheap cap: BFC + Cap + CA; only beats Tree Hats at ~1-2% Cap + ~3% BFC."}
    - {beequip: beesmas_tree_hat, count: 3, wearers: [diamond], why: "Cheap CRaH + CA placeholder until Wreath/Berets. Needs a mutated bee."}
    - {beequip: whistle, wearers: [cool], why: "Free Haste placeholder from Dapper Bear's Shop when a slot is empty."}
    - {beequip: festive_wreath, wearers: [festive], why: "Only with ~3% HaH roll; expensive."}
    - {beequip: pink_shades, wearers: [basic], why: "Focus source to drop Looker for a Diamond; gifted only."}
  red:
    - {beequip: camphor_lip_balm, wearers: [stubborn, cool, commander, bubble, crimson], why: "Metabee SSSSS+: Pepper pollen multiplier (progression/red.yaml)."}
    - {beequip: smiley_sticker, count: 2, wearers: [stubborn], why: "Honey Mark source in red comps; gifted bee."}
    - {beequip: rose_headband, wearers: [rascal, riley, vicious], why: "Big Convert Rate on red bees (unverified for red comps)."}
  white:
    - {beequip: smiley_sticker, count: 2, wearers: [honey, stubborn], why: "More Honey Marks = more Triangulate pollen (white guide)."}
    - {beequip: toy_drum, count: 2, wearers: [demo, brave], why: "Haste + BAP."}
    - {beequip: sweatband, wearers: [digital], why: "+White Gather; buffs Smiley tokens."}
    - {beequip: whistle, why: "Rest of the 13-15 slot white loadout (with Toy Horn, Paper Angel, Kazoo, 2 Paperclips, Pink Shades)."}
