# BEEQUIPS: what the bot knows about them (ROADMAP K8; owner 2026-10-15:
# "teach ai bequips remember that"). Base for H4 (equip / wax / swap).
#
# Read by brain/beequips.py (load, best_for). Researched 2026-10-15. The
# fandom wiki answers HTTP 402, so facts come from search-result summaries of
# the wiki pages and from the guides below. Confidence per entry:
#   ag_guide   = quoted from data/knowledge/guides/blue_hive_guide.md (AG, 2026-06-06)
#   summary    = third-party summary (techwiser / bee-swarm-simulator.wiki); the
#                stat ranges there are partly garbled -> treat as UNVERIFIED
#   unverified = remembered or inferred, not read anywhere today
# Nothing here has been read off the bot's own screen yet: every stat, level
# and recipe is a wiki/guide value, [assumed] until a frame shows it (H4).
sources:
  ag_guide: data/knowledge/guides/blue_hive_guide.md  (section 2.1 Beequips, 5.1 placement)
  techwiser: https://techwiser.com/all-bee-swarm-simulator-beequips/
  bsswiki_mirror: https://www.bee-swarm-simulator.wiki/items/bee-swarm-simulator-beequips
  metabee_wax: https://meta-bee.com/beequips-waxing-mutations/
  wiki_waxes: https://bee-swarm-simulator.fandom.com/wiki/Waxes  (search snippets only, 402)
  wiki_swirled: https://bee-swarm-simulator.fandom.com/wiki/Swirled_Wax  (search snippets only)
  wiki_turpentine: https://bee-swarm-simulator.fandom.com/wiki/Turpentine  (search snippets only)
  wiki_dapper_shop: https://bee-swarm-simulator.fandom.com/wiki/Dapper_Bear's_Shop  (search snippets only)
checked: 2026-10-15

