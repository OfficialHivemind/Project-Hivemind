# AMULETS: what every amulet can roll, and how good a roll is (ROADMAP K9).
#
# Read by brain/amulets.py (load, roll_quality, compare). Researched
# 2026-11-02 through the wiki's api.php (the pages below, revision ids kept).
#
# MEASURED: nothing. No frame under var/ has been read for amulet STATS yet:
# vision/amulet.py only finds the "Keep Old" / "Replace" buttons (measured
# 2026-09-28) and never reads the table between them. Every value here is the
# wiki's DATAMINED table, [assumed] until a frame of the table shows it.
#
# HOW THE `amulets:` BLOCK WAS MADE. Module:Amulet Stats/data is the game's own
# amulet table copied into Lua ("taken directly from the game, with minor
# modifications"). It was run through lua5.4, dumped to JSON and written out
# one stat per line; nothing was typed in by hand. `stat` is the wiki's display
# name for the stat (Module:AmuletStatParser), the name the Keep/Replace table
# is EXPECTED to show -- unconfirmed until a frame is read.
#
# FIELDS (wiki Amulet#Generation):
#   pick N, pool [...]  -- N stats are drawn from the pool; pick_paid is the
#                          count when the paid option is taken (Supreme Star).
#   chance              -- on a stat: after being picked it stays with this
#                          probability, so an amulet can have fewer stats;
#                          on a pool: the pool is used at all with this chance.
#   range [min, max]    -- the stat's strength; the amulet's QUALITY biases the
#                          roll towards max, it never guarantees it.
#   bias [q, d]         -- biasQuality, biasDirect (both 1 when absent):
#                          bias = min + (max-min) * d * quality / max(1, q*(1-quality)).
#                          A big q (Moon's Instant Conversion: 10000) keeps the
#                          roll near min until quality is almost full.
#   step                -- the roll is rounded to this.
#   linear_to_quality   -- Moon capacity: 25000 + 225000*min(1, quality/0.24875).
#   op add / mul        -- "+0.3 Blue Pollen" adds 30%; "x1.15 Convert Rate" multiplies.
#   quality.unit/max    -- what raises the quality and where it tops out; a
#                          tier's range is where that tier is given (null = no top).
#
# WHICH ROLLS ARE BETTER (brain/amulets.py). A stat's roll is better the closer
# it sits to its max; a stat of another hive colour (Red/White Pollen in a
# blue hive) counts for nothing. That weighting is a strategy choice, not a
# game fact. Across tiers the wiki says "Higher tier amulets grant more and
# better buffs" (Shell, Stick Bug, Cog pages).
#
# ROADMAP K9 also names "Antlion": no such amulet exists (wiki api.php: page
# "Antlion Amulet" missing); the Ant Challenge's is the Ant Amulet.
sources:
  - id: w_amulet
    title: 'BSS Wiki: Amulet (rev 448314, 2026-07-12): generation, Keep Old / Replace'
    url: https://bee-swarm-simulator.fandom.com/wiki/Amulet
  - id: w_amulet_data
    title: 'BSS Wiki: Module:Amulet Stats/data (rev 446735, 2026-04-02): the datamined stat table'
    url: https://bee-swarm-simulator.fandom.com/wiki/Module:Amulet_Stats/data
  - id: w_amulet_names
