# Where each amulet comes from and what raises its quality. [assumed] all.
groups:
  star:
    from: 'Star Hall generators, bought with honey; tiers gated by gifted bee types DISCOVERED (5/10/20/30/40) at 25M/50M/250M/1B/10B honey (gear_prices.yaml has the first three)'
    quality: 'linear in discovered gifted bee types, full at 45 (Supreme: 50, not reachable with 46 bee types)'
    passives: 'Diamond: 1/100 chance of Guiding Star or Star Shower. Supreme: one of 6 passives (1/6 each), 1/50 chance of a second; 500B honey buys a guaranteed second (pick_paid)'
    source: [w_star, w_amulet_data]
  moon:
    from: '100 Moon Charms at the Moon Amulet Generator'
    quality: 'linear in Moon Amulets generated, full at 40; capacity +25,000 per amulet (the 7th adds none)'
    source: [w_moon]
  king_beetle:
    from: 'King Beetle drop, 1/7 chance'
    quality: 'linear in King Beetle defeats, full at 100'
    source: [w_king_beetle]
  ant:
    from: 'Ant Challenge, every run: points 0-24 Bronze, 25-49 Silver, 50-99 Gold, 100-149 Diamond, 150+ Supreme'
    quality: 'linear in points, full at 400 (a former staff member, unconfirmed on the page)'
    source: [w_ant]
  shell:
    from: 'Stump Snail drop; tiers unlock at 1 (Bronze, Silver), 5 (Gold), 7 (Diamond), 15 (Supreme) defeats (the page itself asks "is this table accurate?")'
    quality: 'linear in Stump Snail kills up to an UNKNOWN number'
    source: [w_shell]
  stick_bug:
    from: 'Stick Bug Challenge: score AND his level, 1M+lvl5 Bronze, 8M+lvl8 Silver, 20M+lvl11 Gold, 50M+lvl13 Diamond (stickbug.yaml agrees)'
    quality: 'linear in score, full at 200M'
    source: [w_stick_bug]
  cog:
    from: 'Robo Bear Challenge: round 5 Bronze, 10 Silver, 15 Gold, 20 Diamond, 25 Supreme'
    quality: 'linear in cogs collected in the challenge, full at 1000'
    source: [w_cog]

