# WHAT KIND OF TOKEN IS THAT, and which ones are worth walking to first.
#
# `vision/tokens.py` finds token-shaped objects -- a cube with a white glyph and
# a black outline -- and measures the colour of the cube face the glyph sits on,
# plus how much of the ring around the glyph is dark. This table turns those two
# numbers into a NAME, and the name into a chase priority.
#
# WHERE THE COLOURS CAME FROM. The owner asked for exactly this: take every
# token image from the wiki so the AI has the exact images. Every
# `face_hsv` below was measured from the game's OWN icon on the Ability Tokens
# page of the wiki -- see data/knowledge/tokens/icon_colours.json for the method
# and the source URL, and data/knowledge/tokens/wiki/ for the files.
#
# AN ICON IS NOT A SCREENSHOT, and this is the honest limit of the whole table.
# The wiki icon is flat art; the game draws a lit 3D cube, at an angle, through
# JPEG. So every entry is `confirmed_in_game: false` until a live frame with that
# token in it agrees with the number. Nothing here has been confirmed yet.
#
# FIVE PAIRS SHARE A COLOUR, so colour alone cannot name them:
#     [16, 208, 255]   Tabby Love / Scratch / Rage  (three, not two)
#     [60, 255, 255]   Focus / Festive Blessing / Beesmas Cheer
#     [0, 255, 255]    Festive Gift / Mind Hack
#     [4, 224, 208]    Inferno / Flame Fuel
#     [108, 48, 192]   Rain Cloud / Tornado
# `dark` is the tiebreak: the share of the icon that is dark strokes. The orange
# trio is Rage 0.00, Tabby Love 0.14 and Scratch 0.64, so a sighting with no dark
# strokes at all reads as Rage rather than as Tabby Love -- which is the right
# way round, because claiming the owner's priority token on no evidence would be
# the worse mistake.
#
# A KNOWN RISK, MEASURED. In the Pineapple Patch the scenery is the same orange
# as Tabby Love: 14 token-sized blobs per frame at H 10-26, and the big pineapple
# decorations sit at H 20-22. Those blobs must still pass the token detector's
# glyph-and-dark-outline test to become sightings at all, so this is a risk to
# PRECISION of naming, not to whether a token is really there. And the cost of
# naming one wrong is a short walk to a token that was worth collecting anyway.
#
# `priority`: lower is chased first. Only two entries have a considered priority;
# the rest share the default, because ranking all thirty-nine by value would be
# invented rather than measured. Unlisted kinds are `unknown` and rank last.
schema: 2
checked: 2026-09-21
source: data/knowledge/tokens/icon_colours.json

# How close a sighting's face colour must be to an entry's, in OpenCV HSV units
# (hue 0-179, saturation and value 0-255). Wide on value because in-game
# lighting and JPEG move it a long way; tight on hue because that is what
# actually separates one token from another.
default_tolerance: {h: 8, s: 70, v: 90}

# How far apart two `dark` shares must be before that number is used to choose
# between kinds that share a colour.
dark_tolerance: 0.25

# HOW LONG A TOKEN LIES ON THE FIELD, for a kind not named (most of them on
# this hive: 11 Diamonds make ~0.8 Blue Boosts a second, plus Focus and Haste,
# all 4 s -- wiki Module:Ability_Tokens/data, read 2026-10-11). brain/tokenbrain
# asks whether a chase arrives before it is gone (LIFETIME_GATE_LIVE).
unknown_life_s: 4

