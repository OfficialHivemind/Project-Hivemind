# WHAT EACH PIECE OF GEAR COSTS IN HONEY, so a fall in the balance can be
# matched against it (brain/owned, DESIGN 8ea).
#
# WHY THIS FILE EXISTS. The owner asked for the bot to check what gear is
# already owned, so it does not save up for something it has.
# Honey only goes DOWN when something is bought -- MEASURED on the test account
# over the saved record (var/trips.jsonl and var/night/run-*.log, 598 dated
# readings, 20 to 26 Sep, read by brain/owned.history): across 258 of the
# bot's own restarts the balance fell once, by 401, and every fall bigger
# than 16,526 (brain/owned.MATCH_TOLERANCE) sits in a stretch where the bot
# was stopped for 31 minutes or more -- seven of them, one of tens of
# millions on 24 Sep among them. So a fall is a purchase, and its size
# says what.
#
# WHAT IS IN IT. Gear that is bought ONCE with honey: the accessories (bags,
# hats, guards, belts, boots), the gliders and the Guild's sprinklers. Two
# other files already price the rest and are read alongside this one, never
# copied into it:
#   * the six gear goals   -> data/knowledge/goals.yaml
#   * the twenty tools     -> data/knowledge/progression.yaml `tools.known`
#
# WHAT IS NOT, ON PURPOSE. Anything bought by the handful: treats (100 honey
# plus 100 per treat -- Treat_Shop), royal jelly (250,000 plus 10,000 per
# jelly -- items.yaml), tickets and eggs. A fall they explain matches nothing
# here and is ASKED about, which is the right outcome for a thing the bot
# cannot price.
#
# WHAT IS IN IT BUT NEVER INFERRED (`infer: false`, the last section): the
# hive-slot ladder and the Star Amulets. They are not gear the plan saves
# for, so owning one changes nothing -- but their prices COLLIDE with gear it
# does: the Gold Star Amulet's 250,000,000 is exactly the Porcelain
# Port-O-Hive's, and left out, a Gold Star Amulet bought would have been an
# exact single match for the first goal, inferred owned and dropped from the
# plan (third review, 2026-09-26). In the table they make that fall a TIE,
# asked about by name; brain/owned never marks one owned, and a fall that is
# exactly one of them alone is kept as evidence, not asked about.
#
# RULES, the same as goals.yaml's: every price is quoted from the wiki page
# named with it, at the revision the research read (2026-09-24/25; local
# research notes, not shipped: the "Ladder" findings).
# `capacity` is the item's own figure: `add` studs of capacity to the static
# sum, `times` a multiplier on the whole (wiki Capacity: "+N adds to the
# bag's base, xN multiplies it"). A bag's `add` REPLACES the old bag's.
