    slot: hat
    capacity: {times: 3}
    shop: diamond_room
    honey: 5000000000
    materials: {blue_extract: 250, oil: 150, glitter: 100, diamond_egg: 5, comforting_vial: 1}
    aliases: [diamond]
    what: >
      x3 capacity, x1.5 blue pollen, Diamond Drain (+10% per blue bee). Replaces
