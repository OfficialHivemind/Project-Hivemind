# THE GEAR THE OWNER ASKED FOR, what each costs, and where each material comes from.
#
# HIS WORDS: "get me the porcelain staff and backpack and honey mask/all ace
# equipment".
#
#   * There is no "porcelain staff". The wiki has exactly two Porcelain items
#     (api.php allpages prefix=Porcelain): the Porcelain Dipper, a tool, and the
#     Porcelain Port-O-Hive, a bag. The only staff among the twenty tools is the
#     Spark Staff, which progression.yaml already says to skip. So "staff" is
#     read as the Dipper and "backpack" as the Port-O-Hive.
#   * "Ace equipment" is the Ace Shop: a gated room in the Badge Bearer's Guild
#     that sells exactly four items -- the Honey Mask, the Honeycomb Belt, the
#     Cobalt Guard and the Crimson Guard (wiki Badge_Bearer's_Guild, Ace Shop
#     tab, rev 2026-07-12).
#   Both readings are interpretations and say so. `goals.order` in the settings
#   is how he changes or drops them.
#
# RULES FOR THIS FILE, the same as progression.yaml's:
#   * Every price and recipe is quoted from the wiki page named beside it, with
#     the revision it was read at (research of 2026-09-24, kept in
#     ~/.cache/hivemind-work/salvage/{items,materials,shop}_research.json).
#     None of these prices changed in any update from 2024-05-23 to the newest
#     the wiki lists (2026-06-08), but the wiki can lag the game: read the
#     price on the shop's own screen before buying.
#   * A count nobody has seen is UNKNOWN, never zero. From 2026-09-26 the bot
#     reads the inventory once a session (act/inventory, DESIGN 8ea) into
#     var/inventory.json; what it has not read, and the owner has not typed
#     into Settings > Goals (`goals.have`), stays unknown.
#   * `capacity:` is the item's own capacity figure, read by brain/owned when
#     a lasting jump in capacity might be a bag (gear_prices.yaml says how).
#
# THE BOT NEVER BUYS ANY OF THIS. The shop's purchase screen has never been
# recorded, and spending honey is the one irreversible action in this game --
# the one thing this bot does not do unattended (DESIGN 8bh, 8bv). When a goal
# becomes affordable it says so in the Decision Inbox and the owner buys it.
# `brain/goals.py` reads this file; so do the GUI's Goals tab and the morning
# report, through the same module.
checked: 2026-09-24
source: >
  bee-swarm-simulator.fandom.com item and shop pages via api.php, revisions
  as noted per entry; the owner's request of 2026-09-24

# The order used when `goals.order` is empty. It is the order he said them
# in -- the Dipper, the backpack, the Honey Mask, then the rest of the Ace room
# -- with the other three Ace items cheapest first, and the Cobalt Guard ahead
# of the Crimson because he asked for a blue hive (account.yaml hive.colour,
# "also i want a blue hive").
#
# THE BUBBLE MASK, added 2026-10-01 after the four above were owned. The
# owner: "i think honey mask was a mistake people tell me that bubble mask was
# better because its for blue". Checked against this bot's own trips before it
# was put here: the mask swap pays when the convert at the hive is short
# against the fill and the walk (H < 0.5 F + 1.25 T, from the two masks' stats:
# x1.82 bag in the Pine Tree against x1.25, the Honey Mask's +80 convert
# amount lost), and MEASURED on run-563 the Pine Tree bag filled in 178-353 s
# (F), the convert took 14-15 s (H) and the round trip 59 s (T: the walks'
# medians, 17.8 s out and 41.3 s home) -- 15 against 162 or more. By the
# research's 10-20% pollen gain that is 12-21% more honey an hour (3.5% if the
# pollen gain were nothing). And it is the closer of the two: only 9 Oil short
# (16/25), where the Belt is short 42 Enzymes, 44 Glue and 9 Oil.
#
# THE NEXT HIVE SLOT BEFORE THE MASK, 2026-10-01. `hive_slot` is priced from
# the hive's own count (brain/goals.with_next_slot): 34 bees, so the slot for
# the 35th, 209,117,953 honey. It needs nothing but honey, where the Bubble
# Mask is held up by 9 Oil that nothing the bot does pays quickly (the Blender
# wants 10 Royal Jelly and 50 Sunflower Seeds an Oil), and saving its 100M
# ahead of the slot would hold the slot back for days. The owner's own buying
# says the same: the hive slots 27-34 were his, 480M in three days. The
# guide's Stage 1 ends at 48 bees; 35 opens the 35-bee zone.
# THE BUBBLE MASK BEFORE THE NEXT HIVE SLOT, 2026-10-06 23:25 -- the owner: "i
# want bubble mask then diamond mask or whatever blue hive guide says". The
# reason the slot went first (9 Oil short, above) is gone: every material is
# held (Oil 25, Glitter 15, Blue Extract 51, Blueberries 10,827) and 100M honey
# is a few hours' farming, where the slot is 894.6M.
#
# AND AFTER IT, THE GUIDES' ORDER, 2026-10-06 23:35 -- the owner: "then diamond
# mask or whatever blue hive guide says cus it knows more than me". Researched
# across Meta Bee (the BSGH authors), itemlevel.net, the 2022 fandom progression
# guide and the fanon colour guide (docs/pending/blue_progression_research.md):
# all put hive slots 40-42 before the Diamond Mask; Meta Bee's alt order runs
# Bubble Mask, slot 40, Riley (owned), slot 42, Cobalt, slot 45, Canister,
# Diamond Mask. The Diamond Mask (5B) comes before slots 43-45 here (34.0B
# between them). The Cobalt Guard replaces the owned Bucko Guard (both right
# shoulder); the Crimson replaces the owned Riley (left). The Honeycomb Belt
# is optional -- the guides disagree -- so it is last but for the slots.
# "hive_slot<=N" asks for the next slot only up to slot N (brain/goals
# with_next_slot).
# GEAR BEFORE SLOTS, BY PAYBACK (the owner approved, 2026-10-13 12:40: "yeah
# sounds good to me"). The research (~/.cache/hivemind-work/research-gear-
# order-2026-10-13.md: the guide, the wiki, meta-bee, the bot's own 321 trips):
# capacity binds -- the bag is 93-100% at the end of most trips and ~45% of a
# trip is overhead -- so the Honeycomb Belt (~140 h to pay back at 100M/h) and
# the Cobalt Guard (~230 h) come before slot 42 (2.38B, +1.75%, ~1,360 h). The
# Crimson Guard is mostly +100k capacity for a blue hive, so after the mask.
# The owner holds a Silver Star Amulet (2026-10-13), so no Bronze.
default_order:
  - porcelain_dipper
  - porcelain_port_o_hive
  - honey_mask
  - bubble_mask
  - honeycomb_belt
  - cobalt_guard
  - hive_slot<=42
  - diamond_mask
  - crimson_guard
  - hive_slot<=45
  - hive_slot

# SUGGESTED ORDERS: named lists the Goals tab may OFFER, never applied by
# themselves -- `goals.order` (his) and `default_order` above stay what they
# are. brain/protips.suggested_order / with_suggested resolve each key to this
# file's own goal, else the progression file's (data/knowledge/progression/
# <colour>.yaml, whose prices and recipes were checked again 2026-10-20 against
# the wiki through api.php action=parse: Petal_Belt rev 448413, Coconut_Clogs
# 448349, Coconut_Canister 448207, Petal_Wand 446918, The_Supreme_Saturator
# 441788, Tide_Popper 448469, Dark_Scythe 446034 -- all agree; the Crimson
# Guard is this file's own). A {blue: , red: } entry is the colour's pick.
suggested_orders:
  # the pro tester, round 2 (20 Oct 2026), answer 11 -- his order, as said
  pro_tester:
    - petal_belt
    - crimson_guard
    - coconut_clogs
    - coconut_canister
    - petal_wand
    - supreme_saturator
    # he named no white tool: a white hive takes the first (an assumption)
    - {blue: tide_popper, red: dark_scythe}

shops:
  mountain_top_shop:
    label: Mountain Top Shop
    where: past the Lion Bee Gate, at the end of the slope beside the Pumpkin Patch
    gate_bees: 25
    gate: the Lion Bee Gate needs 25 bees
    route: >
      none to the counter. `natro_out_white_field_booster` (Natro's
      gtb-mountain) ends at the Field Booster between this shop and the
      Ticket Shop, which sells tickets for honey.
    source: https://bee-swarm-simulator.fandom.com/wiki/Lion_Bee_Gate ; https://bee-swarm-simulator.fandom.com/wiki/Field_Booster (rev 2026-07-12)
  blue_hq:
    label: Blue HQ
    where: the blue building by the Pine Tree Forest; its shop counter reads "Open Shop"
    gate: blue bee types discovered (the wiki's Blue HQ page; the Blue Field Booster on its second floor needs 5)
    gate_evidence: >
      MET: the owner owns the Bucko Guard (goals.owned), which the Blue HQ
      sells, and the bot's natro_out_blue_field_booster walks into it every
      45 minutes (landed 10 of its last 10, 2026-10-01). The panel read "Open
      Shop" inside it on 2026-09-23 04:10 (landmarks.yaml shop_counter).
    route: >
      natro_out_blue_field_booster passes the counter on its way to the
      booster upstairs; nothing stops at it.
    source: https://bee-swarm-simulator.fandom.com/wiki/Blue_HQ (read through api.php 2026-10-01)
  diamond_room:
    label: Diamond Mask's room
    where: past the Cloud Obby (or glided into); its platforms are solid only at night until the mask is owned
    gate: none read; reached by the obby or a glide
    route: none -- the bot has no way there yet, so the purchase is the owner's
    source: https://bee-swarm-simulator.fandom.com/wiki/Diamond_Mask (api.php, 2026-10-06)
  ace_shop:
    label: Ace Shop (Badge Bearer's Guild)
    where: a gated room inside the Badge Bearer's Guild, near the Pine Tree Forest, on the side opposite the sprinklers
    gate: the Guild needs 15 badges; the Ace room needs 1 Ace badge
    gate_evidence: >
      LIKELY MET, NOT READ ON SCREEN. The quest menu read "Earn 15 Badges --
      Complete!" (var/quests.json, 2026-09-24 21:44). The Honey badge turns
      Ace at 100,000,000 honey made; account.yaml had 81,120,375 on
      2026-09-20 and the balance has risen by well over 19M since, and two
      cached reward-feed reads of 2026-09-21 07:38 (var/vlm_cache) say
      "Obtained Honey Badge - Ace!". The badge menu has never been read.
    route: >
      none. `natro_out_blender` walks into the Guild and ends at the Blender;
      nothing reaches the Ace room.
    source: https://bee-swarm-simulator.fandom.com/wiki/Badge_Bearer%27s_Guild (rev 2026-07-12)

goals:
  porcelain_dipper:
    label: Porcelain Dipper
    slot: tool
    shop: mountain_top_shop
    honey: 150000000
    materials: {}
    aliases: [porcelain staff, dipper, staff]
