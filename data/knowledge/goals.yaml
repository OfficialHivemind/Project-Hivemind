  honey_mask:
    label: Honey Mask
    slot: hat
    capacity: {times: 1.25}
    shop: ace_shop
    honey: 100000000
    materials: {treats: 9999, oil: 50, enzymes: 25, gold_egg: 5}
    aliases: [mask]
    what: >
      +25% pollen, +25% bee gather pollen, x1.25 capacity, +50% honey from
      tokens, +80 convert amount, +30% defense, +15% bee ability rate, Coin
      Scatter. Gifted Gold Eggs do NOT count towards the five. Replaces the
      Beekeeper's Mask, so the pollen gain over it is +5% and +5%.
    source: https://bee-swarm-simulator.fandom.com/wiki/Honey_Mask (rev 2025-12-30); https://bee-swarm-simulator.fandom.com/wiki/Egg#Gold_Egg (rev 2026-08-31)
  bubble_mask:
    label: Bubble Mask
    slot: hat
    capacity: {times: 1.5}
    shop: blue_hq
    honey: 100000000
    materials: {blueberry: 500, blue_extract: 50, oil: 25, glitter: 15}
    aliases: [bubble]
    what: >
      x1.5 blue pollen, x1.5 capacity, x1.25 blue field capacity, x1.25 bubble
      pollen, +30% defense, +15% bee ability rate, Bubble Bombs (every 25th
      Bomb token, 25 bubbles). Changed 2024-05-23 (lost +15% instant blue
      conversion; Bubble Pollen x2 to x1.25; gained the blue field capacity).
