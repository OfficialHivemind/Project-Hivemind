      Owning it passes Bubble Bombs to the Diamond Mask.
    source: https://bee-swarm-simulator.fandom.com/wiki/Bubble_Mask (read through api.php 2026-10-01); https://bee-swarm-simulator.fandom.com/wiki/Diamond_Mask
  diamond_mask:
