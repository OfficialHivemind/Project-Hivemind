  honeycomb_belt:
    label: Honeycomb Belt
    slot: belt
    capacity: {add: 150000, times: 1.25}
    shop: ace_shop
    honey: 75000000
    materials: {enzymes: 50, glue: 50, oil: 25}
    aliases: [belt]
    what: >
      +150,000 capacity, +25% capacity, +75 convert amount, +100% loot luck,
      +20% buzz bomb pollen, +50% honey from tokens, +1 colourless bee attack.
    source: https://bee-swarm-simulator.fandom.com/wiki/Honeycomb_Belt (rev 2025-12-30)
  cobalt_guard:
    label: Cobalt Guard
    slot: right shoulder
    capacity: {add: 250000}
    shop: ace_shop
    honey: 200000000
    materials: {blue_extract: 100, stinger: 100, enzymes: 50, glitter: 25}
    aliases: [cobalt]
    what: >
      +250,000 capacity, +50% blue pollen, +20% blue bomb pollen, +3 blue bee
      attack, +10% defense, +100% critical power, Haste Pulser. Right shoulder,
      so it can be worn with the Crimson Guard.
    source: https://bee-swarm-simulator.fandom.com/wiki/Cobalt_Guard (rev 2025-12-30)
  crimson_guard:
    label: Crimson Guard
    slot: left shoulder
    capacity: {add: 250000}
    shop: ace_shop
    honey: 200000000
    materials: {red_extract: 100, stinger: 100, oil: 50, glitter: 25}
    aliases: [crimson]
    what: >
      +250,000 capacity, +50% red pollen, +20% red bomb pollen, +3 red bee
      attack, +10% defense, +10% critical chance, Focus Pulser. Left shoulder.
    source: https://bee-swarm-simulator.fandom.com/wiki/Crimson_Guard (rev 2025-12-30)

# NOT A MATERIAL, but what the Ticket Tent (Gold Eggs, 100 each) and the
# Stinger Shop (10 each) take, so the owner can type his count into
# `goals.have` and the planner can say how many either would buy.
currencies:
  tickets:
    label: Tickets
    sources:
      - kind: machine
        place: wealth_clock
        bot: does
        gives: 1, 2, 3, 4, then 5 tickets per hourly use in one unbroken session
        source: https://bee-swarm-simulator.fandom.com/wiki/Wealth_Clock (rev 2026-07-12); data/knowledge/tickets.yaml

# WHERE EACH MATERIAL COMES FROM, and whether THIS bot does that activity.
#
#   bot: does     -- something the bot already does unattended: a quest giver it
#                    walks to and hands in at (act/bearvisit.GIVERS, with a
#                    Natro route), a dispenser it uses (act/errands), or a drop
#                    its bees pick up while it gathers.
#   bot: gated    -- a game gate this account has not passed yet.
#   bot: cannot   -- needs something the bot does not have: a menu it cannot
#                    drive (the Blender), a fight, a route.
#   bot: yours    -- spends honey or tickets. Never done unattended; listed so
#                    the owner knows it is there.
#
# `bot: does` IS CHECKED, NOT TRUSTED, for a giver or a dispenser: the planner
# (`brain/goals.source_now`) counts a giver only once its prompt is in
# var/bear_panels.json, a dispenser only once var/place_panels.json holds a
# panel naming it, and neither when the owner has switched it off -- otherwise
# the row says "prompt not read yet", "switched off" or "not the bot". So a
# giver the bot learns to reach tomorrow counts from then on without an edit.
#
# `giver:` and `place:` are the names the bot's errands use. `brain/goals`
# sends the givers it does hand in at whose quests pay a material the next
# goals are missing ahead of the others (DESIGN 8dp). `quest:` is a quest name
# (or a list) the planner looks for in the last quest-menu read, to say
# "in the quest menu now".
materials:
  blueberry:
    label: Blueberry
    sources:
      - kind: drop
        bot: does
        gives: dropped while gathering in the blue fields -- the Pine Tree Forest it farms is one -- and by Rhino Beetles and Mantises; 3,816 held on 2026-10-01
        source: https://bee-swarm-simulator.fandom.com/wiki/Blueberry (read through api.php 2026-10-01)
      - kind: dispenser
        place: blueberry_dispenser
        bot: cannot
        gives: one per blue bee every 4 hours, Bee Swarm Simulator Club members only
        source: https://bee-swarm-simulator.fandom.com/wiki/Blueberry_Dispenser
  treats:
    label: Treats
    sources:
      - kind: dispenser
        place: treat_dispenser
        bot: does
        gives: floor(bees^2.5/100 + 0.5) per use, 34 at 26 bees, on a 1-hour cooldown
        source: >
          https://bee-swarm-simulator.fandom.com/wiki/Treat_Dispenser (rev
          2026-02-26); the machine's own timer read "Use the Treat Dispenser
          (59:59)" (var/errand_ready.json) and var/errand_log.json records the
          bot using it
      - kind: quest
        giver: black_bear
        quest: [Get Red-y, One Stop On The Tip Top, Blue Mushrooms 2,
                Pretty Pumpkins, "Black Bear, Why?", Bee A Star]
        bot: does
        gives: >
          100, 200, 300, 400, 500 and 1,000 for those six Star Jelly quests in
          turn, then 2,000 and 2,500 for the first two Mythic quests -- about
          7,000 before "Can't Without Ants" needs the Ant Field
        source: https://bee-swarm-simulator.fandom.com/wiki/Black_Bear (rev 2026-08-23)
      - kind: quest
        giver: polar_bear
        bot: does
        gives: 10 per quest
        source: https://bee-swarm-simulator.fandom.com/wiki/Polar_Bear (rev 2026-06-12)
      - kind: quest
        giver: honey_bee
        bot: does
        gives: 10 treats at 10/41 odds per Honey Hunt
        source: https://bee-swarm-simulator.fandom.com/wiki/Honey_Bee_(NPC) (rev 2026-09-21)
      - kind: drop
        bot: does
        gives: field and mob drops while gathering; the reward feed has shown Treats many times, at no measured rate
        source: https://bee-swarm-simulator.fandom.com/wiki/Treat (rev 2026-05-05); var/vlm_cache feed reads
      - kind: shop
        place: treat_shop
        bot: yours
        gives: 100 honey for the first, +100 per treat, capped at 10,000 each -- 99,495,000 honey for 9,999 from fresh
        source: https://bee-swarm-simulator.fandom.com/wiki/Treat_Shop (rev 2026-08-04)
  oil:
    label: Oil
    sources:
      - kind: quest
        giver: polar_bear
        bot: does
        gives: about 6.67% chance per quest
        source: https://bee-swarm-simulator.fandom.com/wiki/Polar_Bear (rev 2026-06-12)
      - kind: quest
        giver: brown_bear
        bot: does
        gives: milestone quests 35 and 105 (1 each), 160 (3), 185 (1), 255 (3), 285 (3); how many this account has done is unknown
        source: https://bee-swarm-simulator.fandom.com/wiki/Brown_Bear (rev 2026-06-15, datamined; the Oil page's older table disagrees on 160, 255 and 285)
      - kind: drop
        bot: does
        gives: rare while gathering in the Sunflower Field; common from Werewolves, rare from Mantises, which the bees fight while gathering
        source: https://bee-swarm-simulator.fandom.com/wiki/Oil (rev 2026-02-09)
      - kind: blender
        bot: cannot
        gives: 50 Sunflower Seeds + 10 Royal Jelly, 5 minutes -- the Blender's menu is not driven by this bot
        source: https://bee-swarm-simulator.fandom.com/wiki/Blender (rev 2026-02-19)
  enzymes:
    label: Enzymes
    sources:
      - kind: quest
        giver: polar_bear
        bot: does
        gives: about 6.67% chance per quest
        source: https://bee-swarm-simulator.fandom.com/wiki/Polar_Bear (rev 2026-06-12)
      - kind: quest
        giver: brown_bear
        bot: does
        gives: milestone quests 45, 115, 130 and 165 (1 each), 230 (3), 305 (3)
        source: https://bee-swarm-simulator.fandom.com/wiki/Brown_Bear (rev 2026-06-15)
      - kind: drop
        bot: does
        gives: common from Spiders (1-25), rare while gathering in the Pineapple Patch and the Spider Field
        source: https://bee-swarm-simulator.fandom.com/wiki/Enzymes (rev 2026-09-14); https://bee-swarm-simulator.fandom.com/wiki/Spider (rev 2026-07-12)
      - kind: blender
        bot: cannot
        gives: 50 Pineapples + 10 Royal Jelly
        source: https://bee-swarm-simulator.fandom.com/wiki/Blender (rev 2026-02-19)
  glue:
    label: Glue
    sources:
      - kind: drop
        bot: does
        gives: common from Spiders and Werewolves; the feed read "+1 Glue (from Spider)"
        source: https://bee-swarm-simulator.fandom.com/wiki/Glue (rev 2026-07-12); var/vlm_cache/2c/2cfc177571a89ea9d859ebc51be1dcc1b3dee309b39278780a3b55743ef66020.txt
      - kind: quest
        giver: brown_bear
        bot: does
        gives: milestone quests 140 and 235 (1 each), 310 (3), 395, 470 and 510 (5 each)
        source: https://bee-swarm-simulator.fandom.com/wiki/Brown_Bear (rev 2026-06-15)
      - kind: dispenser
        place: glue_dispenser
        bot: gated
        gives: 2-5 every 22 hours (3 at Goo Ace), in Gummy Bear's Lair, entered with a gumdrop used on the Gummy Bee at the Egg Claim -- a step the route does not do; the badge gate (Goo Hotshot) is passed, the badge menu read "Goo Badge - Ace, 152,571,602 / 500,000,000 Goo" on 2026-10-14 05:36
        source: https://bee-swarm-simulator.fandom.com/wiki/Glue_Dispenser (rev 2026-07-12); var/badges/20261014-053607/page.txt
      # THE GUMDROP SHOP, for the Blender's Glue (the owner, 2026-10-14 07:55:
      # tickets may go on Gumdrops or Glue). Not Glue itself: no shop sells it
      # for tickets or honey. `price` is tickets a Glue, 16.7 rounded up.
      # run_farm gumdrop_buy_due buys 300 when the Blender's Glue lacks them;
      # `bot: yours` stops that.
      - kind: shop
        place: gumdrop_shop
        bot: does
        currency: tickets
        price: 17
        gives: the Blender's 50 Gumdrops a Glue (with 10 Royal Jelly), 300 for 100 tickets -- the cheapest Glue for tickets
        source: https://bee-swarm-simulator.fandom.com/wiki/Gumdrop_Shop (rev 2026-07-12); https://bee-swarm-simulator.fandom.com/wiki/Glue (rev 2026-07-12); var/purchases.json ("300 Gumdrops | 100 Tickets" bought 2026-10-07 07:47 and 2026-10-09 12:20)
      - kind: blender
        bot: cannot
        gives: 50 Gumdrops + 10 Royal Jelly
        source: https://bee-swarm-simulator.fandom.com/wiki/Blender (rev 2026-02-19)
  glitter:
    label: Glitter
    sources:
      - kind: quest
        giver: black_bear
        quest: Pretty Pumpkins
        bot: does
        gives: 1 from "Pretty Pumpkins" (Star Jelly quest 18); 10% on some repeatables after the Mythic line
