      Replaces the Golden Rake.
    source: https://bee-swarm-simulator.fandom.com/wiki/Porcelain_Dipper (rev 2026-07-12); https://bee-swarm-simulator.fandom.com/wiki/Mountain_Top_Shop (rev 2026-07-12)
  porcelain_port_o_hive:
    label: Porcelain Port-O-Hive
    slot: bag
    capacity: {add: 600000}     # replaces the bag's own (brain/owned)
    shop: mountain_top_shop
    honey: 250000000
    materials: {glitter: 3, soft_wax: 3, moon_charm: 10}
    aliases: [backpack, porcelain backpack, porcelain bag, port-o-hive, port o hive]
    what: >
      +600,000 capacity, +250% convert rate, x1.25 convert rate at the hive,
      +10% instant conversion, +50% white pollen. Replaces the Blue
      Port-O-Hive. (The Mountain Top Shop page's Bags tab still shows the
