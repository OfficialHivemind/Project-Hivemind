brown_bear:
  source: https://bee-swarm-simulator.fandom.com/wiki/Brown_Bear (api.php rev 448031, read 2026-10-21)
  repeatable: true  # infinite: 41 possible quests, pollen goal scales with quests done; every quest = 1 Ticket + Royal Jelly and Honey that scale with count, +3 Jelly Beans every 3rd quest, milestone items every 5th
  note: "Royal Jelly per quest by quests completed: 0-5:1, 6-15:2, 16-25:3, 26-30:5, 31-40:10, 41-50:20, 51-60:30, 61-75:50, 76-100:100 ... 2251-2500:2,500,000. Milestones e.g. 25 Silver Egg, 50 Gold Egg, 75 Diamond Egg, 100 Mythic Egg, 150 100 Tickets."
  quests:
    - name: "Sun-Dand"
      rewards: {honey: 0, tickets: 1, royal_jelly: 0, treat: 0, items: {}}  # scales (honey, royal_jelly)
