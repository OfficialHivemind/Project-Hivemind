honey_bee:
  source: https://bee-swarm-simulator.fandom.com/wiki/Honey_Bee_(NPC) (api.php rev 449569, read 2026-10-21)
  repeatable: true  # one endless quest (Honey Hunt), n-th time: collect 500*n Honey Tokens; honey 1,000*n^2+10,000 + Conversion Boost + one random extra (Ticket/10 Treat/1 Royal Jelly/5 Sunflower Seed ~24.4% each, Magic Bean ~2.4%); every 10th quest from 10 to 100 gives Star Jelly instead
  quests:
    - name: "Honey Bee's Honey Hunt"
      rewards: {honey: 0, tickets: 0, royal_jelly: 0, treat: 0, items: {"Conversion Boost (30 minutes)": 1}}  # scales (honey); + 1 random extra item
      raw: "Honey 1,000 x n^2 + 10,000 ; Conversion Boost (30 minutes) ; Other items (see Rewards)"

