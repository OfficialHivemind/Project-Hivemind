# QUEST REWARDS by giver (ROADMAP B20: every errand priced). Read from the Bee
# Swarm Simulator Fandom wiki through api.php on 2026-10-21, each giver's page
# and revision under `source`. Main quest tables only (no event quests).
# `rewards` holds only what the wiki states; scaling rewards are 0 with a
# `# scales` note and the rule in `repeatable`/`note`. "(on accept)" items come
# when the quest is taken, "(N% chance)" items only sometimes.
# Used to price quest progress (brain/value): a step is worth its quest's
# reward / the steps left. Rewards MEASURED from the reward feed at hand-in
# replace these once there are some.
