learned:
- fact: The top-centre panel reads "Claim Hive" when standing on a free hive pad.
  evidence: Read live by the vision model, then pressing E changed it.
  when: 2026-09-20
  confidence: measured
- fact: An owned hive shows "Make Honey" on the top-centre panel; stepping off removes it.
  evidence: Six reads over fifteen seconds, all identical; absent when stepped off; back on
    return.
  when: 2026-09-20
  confidence: measured
- fact: Swinging the collecting tool roughly triples the pollen rate.
  evidence: 780 pollen/sec from bees alone against 2,193/sec with the tool, same field, two
    minutes.
  when: 2026-09-20
  confidence: measured
- fact: Dying empties the entire backpack and returns the player to the hive.
  evidence: Seen on a live run of the test account; a session holding several hundred
    thousand pollen started the next run at 0.
  when: 2026-09-20
  confidence: measured
- fact: The red cannon is boarded by pressing E at it; the flight takes about 8 seconds.
  evidence: The route step that works; panel reads "Fire the Red Cannon" when in range.
  when: 2026-09-20
  confidence: measured
- fact: The shop counter is beside the cannon and its panel reads "Open Shop".
  evidence: Read live; the bot repeatedly mistook this spot for its destination.
  when: 2026-09-20
  confidence: measured
