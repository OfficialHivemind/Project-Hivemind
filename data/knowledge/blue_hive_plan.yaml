# The blue hive plan. EVERY GOAL IN HERE IS THE GUIDE'S, NOT OURS.
#
# SOURCE, saved verbatim alongside this file:
#   data/knowledge/guides/blue_hive_guide.md
#   "The Definitive Blue Hive Guide", by AG gaming, updated 2026-06-06
#   docs.google.com/document/d/1i9rz9mGYeVQQD7j2PaBB5p2gZPp_PX1HP-0GltTlWgA
#
# WHY THIS FILE WAS REWRITTEN, 2026-09-21. The owner looked at the goal web and
# said "the goals seem weird ... the goals should be this guide". He was right,
# and the reason is worth writing down so it does not come back.
#
# The goal web was drawing TWO plans at once. Down the middle ran a hand-
# written paraphrase of this guide. Off to the side ran a ladder built from the
# Bee Swarm wiki -- which proposed the Porcelain Dipper at 150,000,000 honey,
# a Basic Egg at "1,000 honey", a hive slot and the Coconut Field. Not one of
# those four appears anywhere in the guide. The wiki ladder is a fine answer to
# "what does the shop sell"; it is not an answer to "what should I do next",
# and drawing it as goals put four cards in front of the owner that his own guide
# never asked for.
#
# So: the stages below carry the guide's own 'Progression' checklists, quoted.
# `say` is the guide's wording. `note` is the guide's own parenthetical. Our
# commentary is confined to `we_say`, and is always marked as ours.
#
# THE MACHINE-READABLE PART. `needs` and `target` exist so the bot can tell
# which items it can check for itself (bee count, level) from those it cannot
# (an amulet roll). An item with no `needs` is not checkable and is drawn as
# such rather than guessed at. `serves` names the mechanism goal -- from
# progression.yaml, via brain/progress.Ladder -- that actually moves the
# number, so a price hangs UNDER the guide's goal instead of competing with it.
source: The Definitive Blue Hive Guide (Google Doc), updated 2026-06-06
saved_copy: data/knowledge/guides/blue_hive_guide.md
read_on: 2026-09-21
confidence: >
  The owner's chosen guide, quoted. It is guidance, not measurement: where the
  guide and a measurement on this account disagree, the measurement wins and
  the disagreement gets written down. There is one such disagreement so far,
  on the Bubble Wand, recorded under `our_disagreements`.

# ---------------------------------------------------------------- baseline --
# Guide section 1.1. The hive everything is aimed at.
baseline:
  comp: 16 Buoyants | 7 Tadpoles
  comp_bees: {buoyant: [16, 16], tadpole: [7, 7]}
  buoyants: 16
  tadpoles: 7
  say: >
    You can realistically go lower, but always use 16 buoyants as a goal to
    aim for. You can go as low as 14 during severe underfill [generally during
    early blue]. You can go as low as 6 Tadpoles with 1500+ Polar during
    extreme overfill. Up to 12 Tadpoles can be used if you underfill; past 12,
    another Diamond will provide more honey than a 13th Tad. Up to 18 Buoyants
    can be used during overfill, however a Diamond is almost always more
    effective for honey than a Buoyant past 16.

never_run: [shy, lion, frosty, cobalt]
never_run_say: A Diamond will always provide more honey for that slot.

# THE EVENT BEES ROYAL JELLY MAY ROLL AWAY (brain/hivejudge; event bees are
# otherwise never rolled -- jelly never rolls one back). THE OWNER, 2026-10-21:
# YES to "use Royal Jelly to swap the Basic, Crimson and Cobalt bees for blue
# ones". Cobalt is blue, but the guide says "Never run Shy / Lion / Frosty /
# Cobalt -- A Diamond will always provide more honey for that slot"
# (guides/blue_hive_guide.md:209), and its pulse's best part (the Red Pulse,
# Red Bomb Sync on red flowers) needs a Crimson in the hive too, which goes
# here as well. Both come back for 250 tickets an egg at the Ticket Tent (wiki
# Cobalt_Bee via api.php, read 2026-10-21). A gifted one is never rolled.
jelly_event_ok: [crimson, cobalt]

# WHAT A ROYAL JELLY ROLL IS FOR once the stage's comp is in: the guide's
# standing want, below -- "you should always push to add as many Diamonds as
# possible" -- and its end comp's Mythics, Tadpoles and Buoyants (Stage 1:
# "Replace Bubbles with mythics"). THE OWNER, 2026-10-02: "jellys also can get
# u mythics so dont buy mythic egg". brain/hivejudge rolls for the comp's short
# bees first, then these; a cell that lands one is kept.
# CORRECTED 2026-10-14: no mythics here. A Royal Jelly roll is a mythic 1 in
# 25,000 (items.yaml royal_jelly.chances; the research of 2026-10-14 (data/knowledge/progression/blue.yaml, wiki Royal_Jelly via api.php)), so jelly is
# not planned for Tadpoles or Buoyants: those come from Mythic Eggs (2,500
# tickets, Black Bear ~75, Brown Bear 100/200/400, Commando 50, Dapper 15) and
# Diamond Eggs (5% mythic). A mythic a roll lands is still kept.
jelly_targets: [diamond]

diamonds_are_the_engine:
  passive: Shimmering Honey
  say: >
    Via its passive 'Shimmering Honey', each Dia gains a 50% Honey at Hive
    [+5% per lvl] bonus when converting. With proper Mutations + Beequips, you
    can effectively double your hourly honey with 3-6 Diamonds. This is why all
    comps contain an increasing amount of Diamonds, as you should always push
    to add as many Diamonds as possible.

# ------------------------------------------------------------- where we are --
# WHICH STAGE THIS ACCOUNT IS IN, and how that is decided rather than assumed.
# Stage 1's gate is 48 bees; the account has 26 proved. So: Stage 1.
standing:
  stage: 1
  decided_by: bee count against each stage's gate
  bees_known: 34
  bees_known_from: the bee menu's own header, read 2026-10-01 22:29 (account.yaml)
  note: >
    34 bees against Stage 1's gate of 48. Bee count is the only stage gate the
    bot can currently read for itself -- level, amulet rolls and gifting are
    all invisible to it, so a stage cannot be CONFIRMED complete, only ruled
    out. See `unreadable` at the bottom.

# ------------------------------------------------------------- the stages ---
# Guide section 1.3 'Blue Progression'. The `progression` list under each stage
# is the guide's own checklist, quoted. These ARE the goals -- the goal web
# draws this list and nothing else as its spine.
stages:
  - id: 1
    name: Stage 1 — Earlygame Blue
    comp: 13-14 Bubbles | 5 Diamonds
    # `comp`, for brain/hivejudge to count against the bee menu's read: the
    # guide's numbers above, [least, most].
    comp_bees: {bubble: [13, 14], diamond: [5, 5]}
    say: >
      As we are unable to roll for Mythics [due to lack of honey], we use
      Bubbles as placeholders for Tadpoles + Buoyants. Additionally, Bubble
      Bees produce both Bubbles + Bombs which makes it considerably more
      impactful for fill compared to Frosties or Ninjas. Diamonds are run for
      extra HaH when converting + source of Blue Boost.
    progression:
      - say: Get any SSA with Popstar
        note: stats don't matter for now
      - say: Replace Bubbles with mythics
        note: 12 Tadpoles + any Buoyants
      - say: 2/5 Popstar
        note: with Blue pollen and Convert rate
      - say: 48 Bees
        needs: bees
        target: 48
        serves: [basic_egg, hive_slot]
      - say: Level up to 15
        needs: level
        target: 15
    gate: 48 bees and level 15

  - id: 2
    name: Stage 2 — Transition Blue
    comp: 10 Buoyants | 12 Tadpoles | 2 Diamonds → 14 | 10 | 5
    say: >
      This section of Blue is used to bridge the gap between Early Blue and
      Honeymaking Blue at lvl 18+. We aim to maximise our hourly to speed up
      progression through gifting, levelling, and rolling for SSA, while
      maintaining utility bees such as Windy + Vicious for Amulet + tool
      grinding.
    progression:
      - say: 50 Bees
        note: don't level above 15 before this
        needs: bees
        target: 50
        serves: [basic_egg, hive_slot]
      - say: 4/5 Popstar
        note: with BP, CR, BAR/CC/Pollen
      - say: Level up to 16
        needs: level
        target: 16
      - say: Gift 6 Tadpoles
        note: to replace Baby bees
      - say: Improve SSA
        note: either high stat 4/5 or decent stat 5/5
      - say: Level up to 17
        needs: level
        target: 17
      - say: Gift all Buoyants
      - say: 3/5 Double passive SSA
        note: with BP and CR
      - say: Level up to 18
        needs: level
        target: 18
    gate: level 18, fully gifted

  - id: 3
    name: Stage 3 — Honeymaking Blue
    comp_full_diamond: 16-17 Buoyants | 8 Tadpoles | 8-9 Diamonds
    comp_semi_diamond: 17 Buoyants | 9 Tadpoles | 6 Diamonds
    say: >
      Now that we are lvl 18 and fully gifted, we should be able to RBC boost
      for 80x+ blessing comfortably, meaning we can push past the limit for
      Diamond count to maximise our honey per hour. If you are unable to
      maintain blessing for long periods of time, we run Semi Dia comp until
      lvl 20. Full Diamond comp assumes at least 1 Tad alt.
    progression:
      - say: Finish gifting all Bees
      - say: Mutations of Musics, Bear, Bubble, and Diamonds
        note: remember to mutate Musics + Bubble + Diamonds with RJ
      - say: Improve Diamond mutations to 25%+ CA using RJ and Blueberries
        note: they should already be ~15%+ CA from Bitterberries; be wary of fruit costs
      - say: Improve DP SSA
        note: either high stat 3/5 or decent stat 4/5
      - say: Transition to Blessing Boosting Blue
        note: if you can maintain 80x blessing
      - say: Level up to 20
        needs: level
        target: 20
    gate: level 20

  - id: 4
    name: Stage 4 — Endgame Blue
    comp_standard: 16 Buoyants | 7 Tadpoles | 10 Diamonds
    comp_glitter_extend: 16 Buoyants | 6-7 Tadpoles | 12-13 Diamonds
    say: >
      These comps assume you macro with 2 Tad alts + 1-3 Guiding alts, very
      high stat Amulets + Beequips, and have a decent chunk of bees fully
      mutated. Past this point is a long path of optimisation and a lot of
      alt-building to push to lvl 22 + any leaderboards.
    progression:
      - say: Mutations on all bees
        note: high CA on Diamonds
      - say: Blessing boosting + maintaining 100x
      - say: Progression of Glitched Drives on Digi
        note: daily R20/25
      - say: Moving to lvl 21
        note: Diamonds first
        needs: level
        target: 21
      - say: Getting 200+ Stickers on the stack to macro with
      - say: Finalisation of alts, Amulets, Beequips, and tools

# ------------------------------------------------------------------ tools ---
# Guide section 1.3, 'Tool Progression'. THE GUIDE NAMES FIVE TOOLS AND NONE OF
# THEM IS BOUGHT WITH HONEY FROM A SHOP LADDER -- they come from quests and
# material grinding, which is why the wiki's honey ladder answered a different
# question than the one being asked.
#
# The progression itself is an IMAGE in the document and did not survive the
# text conversion. Only the legend did, and it is quoted exactly. Anything more
# specific than this has to be read off the diagram in the document.
tools:
  named_by_the_guide: [petal, hydro, heat_treated, tide, pop]
  say_overall: >
    Set individual goals for endgame tools. E.g., Petal, Hydro, Heat-Treated,
    and colour-specific collectors should be obtained ASAP without a strict
    timeline.
  legend:
    blue_border: Get Tide before Petal if you macro for 22h+ per day / 16h+
    red_border: Hydro and Heat can be skipped for PoP directly
    white_border: Petal/Hydro/Heat should realistically be bought before transitioning
  how_they_are_obtained:
    heat_treated: >-
      Riley quests. The guide: "When trying to complete Riley quests for
      Heat-Treated / Dark Scythe, you will need to transition into a quest comp"
    tide: >-
      Bucko quests. The guide: "Bucko: turn on when grinding for Hydro / Tide"
    hydro: >-
      Bucko quests, from the same line as Tide
  unknown:
    - the Tool Progression diagram itself, which is an image in the document
    - what PoP abbreviates; it is not in the guide's Definitions section
    - the material and quest requirements for each, and their costs

# ------------------------------------------------- the biggest multipliers --
# Guide sections 1.1, 2.3 and 3.4, in the guide's own order of importance.
multipliers:
  nectar:
    worth: ~2-5x honey. "By far the most important buff in the game."
    max_stats: ["2.25x Blue Pollen", "2x Blue Convert Rate",
                "1.5x Honey at Hive", "1.27x Honey Per Pollen",
                "2x Convert Rate at Hive", "15% Bee Ability Rate"]
  balloon_blessing:
    worth: up to 4x Capacity and 2.5x Honey at Hive at 100x blessing
    say: >
      Increasing blessing ALWAYS increases honey per hour, whatever the comp.
      You can easily push to 50x+ with ~15m of work / 80x+ with ~1h of work.
      Never let the macro set your blessing.
  polar_power:
    worth: 1.05x Max Bee Energy per Polar Bear quest completed, NO LIMIT
    scale:
      100-200: DANGER ZONE
      200-500: Really Bad
      500-1000: Acceptable
      1000-1500: Good
      1500-3000: Excellent
    say: >
      START MACROING POLAR NOW! Don't wait any longer. Minimum goal is 1500 to
      avoid being limited by it. Do not stop until Quest Grandmaster (2.25x
      Capacity). Vicious adds ~5% to polar rate; gather interrupt ~16%.
    we_say: >
      OURS, not the guide's: this is the most bot-shaped task in the whole
      document -- a repeatable quest grind measured in thousands of
      completions. It is also entirely blocked: the bot cannot talk to a bear,
      so it cannot accept or hand in a single Polar quest. See docs/GAPS.md §6.

# ------------------------------------------------------------- the orders --
gifting_order: [1 Buoyant, 1 Fuzzy, 1 Tadpole, 6 Tadpoles,
                8 Tadpoles + 10 Buoyants, 14 Buoyants,
                rest Tadpoles (10-12), rest Buoyants (15-16)]
gifting_gives: ["1.5x Attack", "1.5x Convert Amount", "1.5x Gather Amount",
                "a unique Gifted Hive Bonus (does not stack)"]
gifting_how: >
  Between levels 15 and 18, via the Ticket Shop: Honey -> Tickets -> Star
  Treats fed to bees, helped along by the Wealth Clock and Blueberries. Using
  Royal Jelly to gift is only worth it if 500 Tickets would cost more than 15T.

levelling_order: [Diamonds, Digital, Bear, Musics and Bubble, Tadpoles,
                  Buoyants, Focus/Haste producers, the rest]
levelling_gives: ["10% Convert Amount", "5% Gather Amount",
                  "5% Max Bee Energy", "3% Bee Movespeed"]

token_producers_wanted: {token_link: "4-6", focus: "5-7", haste: "1-3",
                         melody: "3-4"}

notable_bees:
  bear: "~1.5-2x honey via bear morphs. Owning it is NOT optional — buy or trade for it [currently 11-12 signs]."
  exhausted: "20% White Field Capacity, best Token Link source, infinite energy. 20% WFC = 3% Pine Tree cap | 5% Bamboo cap | 6% Blue Flower cap."
  stubborn: "15% ATL, the strongest boost to token uptime over any other bee."
  windy: "Tornado helps fruit collection and adds pops per Popstar. Always run unless you have Tide/Hydro, are fully gifted, or have Tad alts."
  vicious: "15% Monster Respawn Time reduction — speeds Polar quests and helps amulet grinding. Remove past 500 Polar."
  puppy: "20% Bond From Treats, 1.1x Capacity and +Focus via Reindeer Antlers. Without the Antlers, only run past lvl 16."
  fuzzy: "1-2 needed for pollination if you have no alts."
  baby: "4 needed until 6 Tadpoles are gifted; remove 1 per 1.5 gifted Tads."

# ----------------------------------------------------- macro settings ------
# Guide section 3.3, filtered to what is relevant to THIS bot.
macro_settings:
  mondo_killing: OFF — it steals one gather attempt per hour
  gather_interrupt: OFF for quests
  gather_time_minutes: "7-10 (10 is fine for most)"
  blue_extracts: always use, unless blueberries are genuinely needed
  pine_pattern: Kettle — or Skillet/Plate if the game lags
  fields_that_matter: [pine_tree, bamboo, blue_flower]
  we_say: >
    OURS: of the three fields the guide says matter, the bot has a recorded
    route to ONE (pine_tree). Bamboo and Blue Flower have no route at all, and
    the bot spent the whole of 2026-09-20 farming the Pineapple Patch, which
    the guide never mentions. See docs/GAPS.md §1.

# ------------------------------------------------ where we disagree, and why --
# The guide is guidance; a measurement on this account beats it. Every entry
# here is a place the two parted company, with the evidence.
our_disagreements:
  bubble_wand:
    guide_says: >
      "colour-specific collectors should be obtained ASAP without a strict
      timeline" — and for a blue hive the Bubble Wand is that collector.
    we_measured: >
      The Bubble Wand does 240 pollen/s on blue flowers and 120 on everything
      else; the Golden Rake already held does 167 on all flowers. That makes
      the break-even 39.2% blue ground. MEASURED over 420 frames of the
      Pineapple Patch — the only field the bot actually farms — the ground is
      42.5% blue, 46.8% white, 10.8% red, and the bot's own independent count
      while farming agreed at 42/48/10. Blended: 171/s against 167/s.
    verdict: >
      DO NOT BUY IT YET, and the reason is a routing problem rather than a
      tool problem. 1.02x for 3,500,000 honey is not worth it in the Pineapple
      Patch. In the Blue Flower Field the same tool would be worth roughly
      1.3-1.4x -- but there is no recorded route to the Blue Flower Field, so
      that field cannot be farmed. Record that route and this becomes a buy.
      The owner called this himself: "isnt bubble wand worse than golden rake".
    revisit_when: a recorded route to the Blue Flower Field exists

# ------------------------------------------------------- what we cannot see --
# Stage progress the bot has no way to read. Listed so the goal web can say
# "cannot check" instead of drawing an unticked box that may well be done.
unreadable:
  level: the player level is not read from any screen
  amulets: no amulet or Popstar roll is readable
  gifting: gifted status per bee is not readable
  mutations: not readable
  blessing: not readable
  polar_count: the Polar quest completion count is not readable
  bee_types: read once from a screenshot the owner sent, not by the bot
