# NATRO'S FIGHT, FIELD BY FIELD.
#
# `books`     which mobs a fight here counts as dealt with when the bars are
#             gone -- Natro's own bookkeeping (the LastBugrun* lines cited).
#             A reward-feed "Defeated <Name>!" line books that mob by name.
# `arrive`    done once on arrival, before looking (turn = camera taps, left
#             negative; pause_s; walk = [keys, tiles]).
# `fight_turn` camera taps at the start of the fight that Natro does NOT undo
#             before its loot walk (Rose); the bot undoes it after the loot.
# `look`      Natro's `loop 20 { nm_HealthDetection() ... Sleep 150 }`: how
#             many looks for a first bar, and how far apart.
# `wait`      Natro's `loop N { loop M { look; ...; Sleep S } }`: `rounds` N,
#             `looks` M, `every_s` S, `turn_at` the absent look at which it
#             turns the camera two taps left (`RotLeft 2`, undone after), and
#             `round_pause_s` any extra sleep per round. A round with `dodge`
#             first holds one move of `dodge.tiles` in the next key of
#             `dodge.keys`.
# `loot`      the walk Natro makes over the drops afterwards (tool held):
#             [keys, tiles], or {repeat: N, legs: [...]} for its loops.
#             `loot_after_dodge` prefixes the two legs Natro chooses from the
#             last round's index mod 4 (`Mod(i, 4)`).
fields:
  spider:
    source: natro_macro.ahk:13931-14019
    books: [spider]
    # TWO CIRCLES OF THE LOOK AROUND, not Natro's one. MEASURED over 15 runs
    # (var/bugrun.json, 2026-09-27): 4 found the Spider, its first bar at 4.9,
    # 8.5, 4.9 and 8.9 s into a look that ends at ~10 s -- two in its last
    # 1.5 s -- and 11 found nothing, some an hour or more after its 30 min
    # respawn. A second circle costs ~6 s a visit.
    look: {tries: 20, every_s: 0.15, sweeps: 2}            # 13947-13955
    wait: {rounds: 30, looks: 20, every_s: 0.10, turn_at: 10}   # 13965-13985
    loot:                                                  # 14010-14017
      - [d, 3]
      - {repeat: 3, legs: [[w, 9], [a, 1.5], [s, 9], [a, 1.5]]}
      - [s, 6]

  strawberry:
    source: natro_macro.ahk:14047-14146
    books: [ladybug]
    arrive: [{pause_s: 1.0}]                               # 14063
    look: {tries: 20, every_s: 0.15}                       # 14068-14076
    wait: {rounds: 10, looks: 10, every_s: 0.10, turn_at: 5}    # 14086-14106
    loot:                                                  # 14129-14137
      - [s, 2]
      - [ds, 8]
      - {repeat: 2, legs: [[w, 14], [a, 1.5], [s, 14], [a, 1.5]]}
      - [w, 14]

  mushroom:
    source: natro_macro.ahk:14166-14248
    books: [ladybug]
    arrive: [{turn: -2}]                                   # 14175
    look: {tries: 20, every_s: 0.15}                       # 14179-14187
    wait: {rounds: 10, looks: 20, every_s: 0.10, turn_at: 10}   # 14197-14216
    loot:                                                  # 14239-14246
      - [ds, 5]
      - [d, 2]
      - {repeat: 4, legs: [[w, 9], [a, 1.5], [s, 9], [a, 1.5]]}   # nm_loot(9, 4, "left")

  clover:
    source: natro_macro.ahk:14255-14361
    # Natro books only LastBugrunLadybugs here (14326) and fights its rhino
    # beetles at Blue Flower next (14366-14378). The wiki puts one of each in
    # this field, and a fight here ends only when every bar is gone, so both
    # are booked -- the reward feed's "Defeated <Name>!" line says which died.
    books: [ladybug, rhino_beetle]
    look: {tries: 20, every_s: 0.15}                       # 14283-14291
    wait: {rounds: 10, looks: 10, every_s: 0.25}           # 14300-14313, no turn
    loot:                                                  # 14340-14352
      - [d, 4]
      - [w, 8]
      - [a, 1.5]
      - [s, 8]
      - [a, 1.5]
      - [w, 8]
      - [a, 1.5]
      - [s, 16]
      - {repeat: 2, legs: [[a, 1.5], [w, 8], [a, 1.5], [s, 8]]}

  blue_flower:
    source: natro_macro.ahk:14366-14473
    books: [rhino_beetle]                                  # 14449
    look: {tries: 20, every_s: 0.15}                       # 14398-14406
    wait: {rounds: 12, looks: 20, every_s: 0.10, turn_at: 10}   # 14416-14435
    loot:                                                  # 14464-14471
      - [s, 2]
      - [ds, 5]
      - {repeat: 3, legs: [[w, 8], [a, 1.5], [s, 8], [a, 1.5]]}   # nm_loot(8, 3, "left")

  bamboo:
