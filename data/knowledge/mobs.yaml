      - {repeat: 5, legs: [[w, 13.5], [a, 1.5], [s, 13.5], [a, 1.5]]}   # nm_loot(13.5, 5, "left")

  pumpkin:
    source: natro_macro.ahk:14722-14865
    books: [werewolf]                                      # 14839
    look: {tries: 20, every_s: 0.15}                       # 14739-14747
    # Each round first moves 1500*MSF (27 studs) in turn Fwd, Left, Back,
    # Right (`mod(A_Index,4)` = 1, 2, 3, 0), then looks up to 5 times 250 ms
    # apart (14756-14830).
    wait: {rounds: 25, looks: 5, every_s: 0.25}
    dodge: {tiles: 6.75, keys: [w, a, s, d]}
    loot_after_dodge:                                      # 14852-14853
      1: [[s, 4.5], [a, 4.5]]
      2: [[s, 4.5], [d, 4.5]]
      3: [[w, 4.5], [d, 4.5]]
      0: [[w, 4.5], [a, 4.5]]
    loot:                                                  # 14854-14862
      - [s, 4]
      - [sa, 6]
      - {repeat: 4, legs: [[w, 14], [d, 1.5], [s, 14], [d, 1.5]]}
      - [w, 14]

  pine_tree:
    source: natro_macro.ahk:14875-14985
    books: [mantis]                                        # 14953
    look: {tries: 20, every_s: 0.20}                       # 14903-14911
    wait: {rounds: 20, looks: 10, every_s: 0.10, turn_at: 5}    # 14921-14940
    loot:                                                  # 14967-14982
      - [s, 10]
      - [a, 1.5]
      - {repeat: 3, legs: [[w, 10], [a, 1.5], [s, 10], [a, 1.5]]}
      - [w, 20]
      - [d, 1.5]
      - [s, 10]
      - {repeat: 3, legs: [[d, 1.5], [w, 10], [d, 1.5], [s, 10]]}

  rose:
    source: natro_macro.ahk:14996-15162
    books: [scorpion]                                      # 15135
    arrive: [{walk: [s, 4.5]}, {walk: [d, 6.75]}]          # 15029-15030
    fight_turn: -4                                         # 15048 (RotLeft 4, not undone)
    look: {tries: 20, every_s: 0.15}                       # 15034-15042
    # Rounds move Back, Right, Fwd, Left (15052-15125), 5 looks 250 ms apart.
    wait: {rounds: 17, looks: 5, every_s: 0.25}
    dodge: {tiles: 6.75, keys: [s, d, w, a]}
    loot_after_dodge:                                      # 15149-15150
      1: [[w, 4.5], [d, 4.5]]
      2: [[w, 4.5], [a, 4.5]]
      3: [[s, 4.5], [a, 4.5]]
      0: [[s, 4.5], [d, 4.5]]
    loot:                                                  # 15151-15160
      - [w, 2]
      - [wa, 10]
      - {repeat: 4, legs: [[s, 16], [d, 1.5], [w, 16], [d, 1.5]]}
      - [s, 16]
      - [wa, 6]

