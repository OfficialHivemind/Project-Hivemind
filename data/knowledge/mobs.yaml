# The field mobs worth killing on purpose, and how Natro Macro kills them.
#
# THE OWNER, 2026-09-25: "go kill enemies". Until now the bot only ever ran
# from them (brain/threat) and let the bees fight whatever came near while it
# gathered (DESIGN 8ce). This is what act/bugrun reads to do it deliberately.
#
# TWO SOURCES, NEVER MIXED UP:
#   * `mobs:` are facts about the GAME, from each mob's own wiki page, read
#     through the MediaWiki API on 2026-09-25 (the page HTML answers 402):
#     https://bee-swarm-simulator.fandom.com/api.php?action=parse&page=<Mob>&prop=wikitext
#     (Ladybug, Rhino_Beetle, Spider, Mantis, Scorpion, Werewolf, Mob).
#   * `fields:` are Natro Macro's own fight in each field, transcribed from
#     nm_Bugrun at the pinned commit 094f9c7b,
#     submacros/natro_macro.ahk:13899-15160 (GPLv3; running and deriving from
#     it privately carries no obligation). Line numbers are cited per entry.
#
# UNITS. Natro walks in TILES and a tile is 4 studs (lib/Walk.ahk: "4 studs in
# a tile", the same rule scripts/transpile_natro.py uses). Its `nm_Move(ms *
# MoveSpeedFactor)` holds with `MoveSpeedFactor := round(18/MoveSpeedNum, 2)`
# (natro_macro.ahk:13930) cover ms/1000 x 18 studs at any movespeed, so
# nm_Move(1000*MSF) is 18 studs = 4.5 tiles and nm_Move(1500*MSF) is 27 studs =
# 6.75 tiles. Keys are the bot's: w forward, a left, s back, d right.
#
# WHAT IS DELIBERATELY NOT TAKEN FROM NATRO (act/bugrun says why at length):
#   * `RotUp 4` / `RotDown 4` (PageUp/PageDown) around each fight -- DESIGN
#     8ap measured the tilt changing nothing and warned that a death mid-way
#     leaves the camera tilted for the next claim sweep.
#   * `ZoomOut` on every look -- Natro plays at full zoom-out; this bot's
#     hive-wall counts, respawn view templates and token sizes were all
#     measured at its own zoom, and a zoom-out would outlive the fight.
#   * The chained walks between fields (spider -> strawberry -> mushroom,
#     clover -> blue flower, bamboo -> pineapple, pumpkin -> pine -> rose).
#     They start from wherever the previous fight left the character, which
#     is never measured; every run here starts from the pad after a convert.
#
# THESE BEES KILL ALL SIX. The bot has never sought a fight, and the quest
# menu's fight steps rose anyway while it gathered where the mobs live (DESIGN
# 8ce): "Defeat 16 Ladybugs. Complete!" (var/night/run-127.log:15), "Defeat 16
# Rhino Beetles. Complete!" (run-011.log:63), Spiders 0/10 (run-362) to 9/10
# (run-388.log:37), Mantises 0/10 (run-362) to 8/10 (run-368.log:37),
# Scorpions 0/15 (run-011) to 14/15 (run-337.log:39), Werewolves 0/5
# (run-362) to 4/5 (run-373.log:37). Every field below asks for 15 bees at
# most (world.yaml `bees_required`) and the account has 26 (account.yaml).
#
# AND THE FEED SAYS SO, KILL BY KILL. MEASURED 2026-09-26 over every cached
# reward-feed read (var/vlm_cache, 17,519 feed texts from 2026-09-21 to
# 2026-09-26, the read time being the file's mtime; scratchpad
# bugrun/kill_gaps.py): "Defeated <Name>!" lines for 398 ladybug, 223 rhino
# beetle, 63 mantis, 42 spider, 10 werewolf and 9 scorpion kills, all while
# gathering. DESIGN 8ce's "the bees cannot kill ... the Werewolf" is
# refuted: 09-22 07:51 "Defeated Werewolf! (+25 Battle Points)" then "+10
# Tickets (from Werewolf) +50 Treats (from Werewolf) +9,384 Honey (from
# Werewolf)".
#
# THE RESPAWN TIMES AGREE WITH THE WIKI ON THIS ACCOUNT: the shortest gaps
# between two kills of one kind in one field, which is respawn plus the time
# the bees took, were 305-309 s (rhino beetle, Pineapple), 308-310 s
# (ladybug, Mushroom; rhino beetle, Blue Flower), 1,211-1,227 s (mantis,
# Pineapple) and 1,815-1,833 s (spider, Spider Field). So no respawn-rate
# bonus shortens them (wiki Monster_Respawn_Rate), and Natro's figures,
# which add a margin to the wiki's, are kept.
#
# THE MOB TABLE (ROADMAP K7, 2026-10-19; brain/mobtable reads it). Every mob
# the bot can meet carries, besides what is above: `kind`, `danger` (0 none,
# 1 low, 2 medium, 3 high), `night` (day / night / both), `drops` and a `src:`
# map that tags EVERY value: "measured: ..." (this bot's own logs, with the
# counts) or "[assumed: wiki ...]" / "[assumed: Natro ...]". The six bug-run
# mobs stay in `mobs:` (act/bugrun's book, which must not grow); the rest are
# in `other_mobs:` and in `rogue_vicious_bee:`, so no run_farm feed reader
# books a kill it did not book before.
#   respawn: the gap between two feed-named kills of one kind in one field,
#     counting only gaps of 0.9-1.5x the wiki's timer (one cycle after a kill).
#   drops: `per_kill` = share of kills with that item read in the feed within
#     -5..+20 s (act/bugrun.measured_loot's window), `mean` = amount per kill.
#     Only what REACHED the account: tokens left lying are not counted.
#   also_seen: feed-named kills in a field the wiki does not list (>= 10).
#     Why is unproven -- night spawns [assumed], a mob chasing over a border,
#     or a stale "(from <field>)" credit; brain/mobtable counts them only
#     when asked about the night.
source: wiki (MediaWiki API, 2026-09-25) and NatroMacro 094f9c7b nm_Bugrun
checked: 2026-09-26

