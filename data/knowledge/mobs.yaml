# THE ROGUE VICIOUS BEE (act/vicious; ROADMAP Q3, 2026-10-19). Kept OUT of
# `mobs:` on purpose: act/bugrun's book reads `mobs:`, and this is no bug-run
# mob -- night only, no respawn timer, found by stepping on its spike.
# [ASSUMED, NOT MEASURED HERE] The levels are the wiki's Rogue_Vicious_Bee
# "Locations" table as act/vicious transcribed it on 2026-10-12 (the wiki API
# answered 402 on 2026-10-19, so not re-read); the bee gates are Natro's
# VBData (natro_macro.ahk:18282-18330, in act/vicious.FIELDS). Not one has
# been seen by this bot: 20 night hunts of Clover and Spider, 13-19 Oct
# (var/vicious.json), all "absent".
rogue_vicious_bee:
  source: wiki Rogue_Vicious_Bee (Locations, HP, Drops; read 2026-10-12)
  confidence: assumed
  # router node -> [lowest, highest] level it spawns at there. A field not
  # listed is unknown and is skipped.
  levels:
    clover: [1, 3]
    spider: [2, 4]
    cactus: [4, 7]
    rose_field: [5, 7]
    mountain_top: [6, 8]
    pepper: [9, 12]
  hp: {1: 1000, 4: 10000, 12: 68000}       # wiki, the three points act/vicious cites
  stingers: 1 at levels 1-3, 2 at 4-6; +5 for the day's first kill (22 h cooldown)
  # THE GATE: the highest level this hive is taken to beat; a field whose
  # top level is above it is skipped, and no value means skip everything.
  # ponytail: a calibration knob, not a measurement -- level 4 is the wiki's
  # 10,000 HP, the Tunnel Bear's, which this hive lost to on 2026-10-12, so
  # this keeps Clover and Spider (combat.vicious's own help text). Raise it
  # once kills are on record (var/vicious.json `tries`); drop it to 3 if a
  # Spider-field Vicious Bee ever kills the character.
  beatable_max_level: 4
  # THE MOB TABLE's keys (ROADMAP K7); `levels` above stays act/vicious's.
  name: Vicious Bee
  kind: night_boss
  fields: [clover, spider, cactus, rose, mountain_top, pepper]
  respawn_seconds: null
  danger: 3
  night: night
  drops: {stinger: "1-2 (+5 the day's first kill)"}
  src:
    fields: "[assumed: wiki Rogue_Vicious_Bee Locations, read 2026-10-12]"
    respawn_seconds: "none: it appears at a spike; the daily-bonus cooldown is 22 h (brain/calendar)"
    hp: "[assumed: wiki `hp` above]"
    drops: "[assumed: wiki `stingers` above]"
    danger: "[assumed: wiki, levels up to 12 and 68,000 HP]; never met (var/vicious.json 19 absent, 1 walk)"
    night: "[assumed: wiki 'spawns at night more often'; act/vicious hunts it at night]"
