# STICKERS: which ones the Sticker Stack may take, and which are kept for rarity.
#
# The owner, 2026-10-07, asked for the bot to learn the Sticker Stack and which
# stickers to keep for their rarity. Stacking a sticker type for the first time gives its Stack
# Reward and CONSUMES the sticker; each type stacks once. Its Stack Boost is
# NOT permanent: every boost stacked applies only while the Stack buff runs,
# 15 min + 10 s per sticker ever stacked (up to 1 h). What is permanent is the
# Sticker Stack badge (25/50/100/250 stacked: +5/10/15/20% bee pollen). 25
# tickets start the buff without a sticker -- NEVER paid: at this count that
# is ~87 tickets an hour of buff (brain-research-2.md section 3).
#
# SOURCE: the wiki's own data, Module:Sticker_Index/Sticker (read through the
# API 2026-10-07, 260 stickers): each sticker's obtainment methods, Stack Boost
# (`boost`) and Stack Reward (`reward`).
#
# RARITY is the sticker's EASIEST source, on the wiki's own words where a
# method has one (Uncommon .. Unfathomably Rare, "Nearly Impossible"), else:
#   odds "1 in N"   N <= 10 -> 1, <= 100 -> 2, <= 1,000 -> 3, <= 10,000 -> 4,
#                   <= 100,000 -> 5, <= 1,000,000 -> 6, more -> 7
#   1 a hidden sticker (daily) or the printer with a Basic Egg
#   2 the printer with a Silver/Gold Egg; a seeker, puffshroom, planter or
#     sprout; field leaves; fireflies
#   3 anything else unrated
#   4 an achievement (once per player), Star Jelly, an event gift box, the
#     printer with Diamond/Mythic/Star/Gifted eggs only
#   5 a seasonal event or catalogue;  6 retired, or a leaderboard prize;
#   8 given out by staff or creators
#
#   0 common  1 uncommon  2 rare  3 very rare  4 extremely rare
#   5 exceptionally rare  6 unbelievably rare  7 unfathomably rare
#   8 nearly impossible
#
# KEEP AT `keep_from` AND ABOVE: never stacked, never discarded. The wiki's
# rare firefly stickers fall where it puts them -- Waxing Crescent Moon (rare)
# may be stacked; Glowing Smile and the Star Signs (extremely rare), Cyan Star
# and Shining Star are kept.

