stages:
- id: early
  name: Fresh account to 25 bees (colourless-leaning starter; white is not a hive colour yet)
  enter_when:
    bees: 1
    honey: 0
    gear: []
  goals:
  - id: basic_egg
    label: 25 bees
    kind: bee
    name: Fill the 25 base slots (Basic Eggs + quest eggs)
    cost:
      tickets: 0
    requires:
    - slot free
    why: Bee count gates every field and most quest givers; Black Bear and Panda give 2 Silver + 2 Gold eggs so
      ~21 Basic Eggs are needed, not 25. Basic Egg price rises per purchase (curve unknown).
    priority: 1
