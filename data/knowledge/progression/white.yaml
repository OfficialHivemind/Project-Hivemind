  tips:
  - 'Redeem the codes the earlygame guide lists first (Beesbuzz123, Crawlers, Connoisseur, Roof, Wax, Nectar, Bopmaster,
    38217): ~10k honey, 30 tickets, 15 gumdrops. Codes may expire - GUESS whether all still work.'
  - 'Do NOT commit to a white hive now: every current guide transitions to white only after the Supreme Star Amulet
    (2026 white guide requires a 5/5 dual-passive SSA, Gummyballer and Coconut Belt). Before that, play colourless-leaning/mixed
    and farm white fields.'
  - Save Diamond Eggs, Star Eggs, Star Jellies, waxes, fruits, bitterberries and boosting materials (glitter, smoothies)
    - the earlygame guide's list of things players regret spending.
  - Hatch every non-Diamond egg on the hive (earlygame guide); a hatch replaces a bee and keeps its level, so a
    free slot is not needed.
  - 'A bot that cannot fight should prefer Sunflower/Dandelion (no mobs): a death empties the bag (Hivemind fields.yaml).'
  - 'MOBS: Panda/Science quests want Ladybugs, Rhino Beetles, Spiders, Mantises, Werewolves - the bees fight them
