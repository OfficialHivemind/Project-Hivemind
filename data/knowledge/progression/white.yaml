mistakes:
- 'Switching to white before SSA: every current source makes white an endgame transition (2026 guide: Gummyballer
  + Coconut Belt + 5/5 dual-passive SSA + 2qd honey + alts). [guide_white_def, seo_white, forum_white_start_2024]'
- Buying the Spark Staff (skip to the Porcelain Dipper). [hm_progression]
- Buying the Bubble Wand / Scythe / Demon Mask / Fire Mask - coloured gear for a colourless plan. [w_demon_mask,
  w_tools]
- Coconut Clogs before the Coconut Canister. [forum_prog_2022]
- Spending Star Jellies before the Petal Belt (needs 25), hatching Diamond/Star/gifted eggs on the hive early, donating
  the first Spirit Petal to the Wind Shrine. [guide_early_def, forum_prog_2022]
- Wasting boosting materials (glitter, smoothies, dice) in early boosts that make no meaningful honey. [guide_early_def]
- Buying Puppy (or any event bee) without a Star Treat to gift it; buying Crimson/Cobalt BEES for a white hive.
  [forum_prog_2022]
- Running Ninja in a white hive (a colourless gifted type is almost always better). [guide_white_def]
- Movement Collection on the Moon Amulet (destroys flowers). [guide_white_def, guide_early_def]
- Fewer than ~12-14 Vectors, or ungifted Precise (useless ungifted). [seo_white, forum_white_2024]
- 'Trusting third-party SEO guides'' recipes: bee-swarm-simulator.wiki lists the Gummy Mask without its 5B honey/100
  Oil/vial and invents Canister/Gummyballer recipes. Read the official wiki or the shop screen. [seo_white, w_gummy_mask]'
- 'Expecting AFK macro honey from white: the fanon page says white ''discourages usage of macros''; another macro says
  fixed patterns are ''especially useless'' for red and white and ships no white token model (Blue/Red/Mixed only).
  [fanon_white, macro_docs_ai_gather]'
- Farming mob fields (Pineapple, Spider, Pumpkin, Coconut) before the hive can kill the guard - a death empties
  the bag. [w_pineapple, w_coconut_crab]
open_questions:
- Is white worth it for Hivemind at all? The account is blue today (account.yaml), the alt is parked, and the 2026
  white guide calls 2 alts + 2-3 gumdroppers mandatory. A solo bot may be better as 'colourless-leaning blue' until
  SSA. Owner decision.
- 'Pineapple Patch colour: wiki FieldTable says 90% white / 5% blue; Hivemind progression.yaml measured 46.8% white
  / 42.5% blue over 420 frames ''of the Pineapple Patch''. One of them is wrong (maybe a different field was measured).'
- Mountain Top Field wiki FieldTable reads white 0 / red 0.333 / blue 0.333 (sums to 2/3) - likely a wiki error;
  read in game.
- Template:NectarTypes lists Motivating as 'x1.1-x1.5 Blue Pollen' (same as Comforting); white guides treat Motivating
  as a white nectar. Verify the buff in game.
- 'Petal Belt recipe: wiki = 15B, 1 petal, 25 Star Jelly, 50 Glitter, 100 Glue; the earlygame guide says it forgot
  to add Oils. Read the Petal Shop screen.'
- 'Gummy Mask vs Diamond Mask first for a pre-SSA white-leaning account (2022 guide: Gummy first; 2026 earlygame
  guide on the blue path: Diamond by 45).'
