  tips:
  - 'White is a BOOST hive: the 2026 guide requires 2 alt accounts and 2-3 gumdroppers (Gummy Mask + 900-1,200 gumdrops
    each), max Satisfying + Motivating nectar, 5x Wealth Clock, dice/glitter/smoothies. A solo passive bot will
    not reach guide numbers.'
