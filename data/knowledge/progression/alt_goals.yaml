# ONE-CLICK TARGETS: "make this account a Fuzzy alt / a Tad alt / get the
# Tide Popper ...", and brain/hybrid merges several into one order.
#
# THE OWNER, 2026-10-26: players may find it hard to set every goal by hand,
# so offer ready targets such as an auto Fuzzy alt or auto Tad alt, and a
# hybrid that picks the fastest way to all of them.
# ROADMAP G12 (VIEWER DarkWolfRfM, VIEWER Trav: a fast pathway to build Fuzzy /
# Tad alts from scratch).
#
# HOW TO READ (same shape and ids as progression/{blue,red,white}.yaml):
#   * Each target has `steps`, a list of goal dicts in the progression files'
#     shape (id, label, kind, slot, cost{honey, items}, requires, why, source).
#     `ref: <id>` REUSES that goal from progression/<hive>.yaml (then the other
#     hives' files), cost and all, so a price is written once. `after: [ids]`
#     says a step must wait for those steps; everything else is free order.
#   * `bees` / `gifted` are how many of each bee type the target wants in the
#     hive. brain/hybrid turns them into Mythic Egg and Star Treat steps from
#     `bee_sources`, so two targets that want the same mythics share the eggs.
#   * `hive_size` is the bee count the target wants; brain/hybrid prices the
#     slots from hive_slots.yaml (the wiki's table) with id hive_slot<=N.
#   * `fact:` MEASURED = a source states it outright (a wiki page or a guide's
#     own number, read on the date given); ASSUMED = our reading of a guide or a
#     count we chose, with the reason. No made-up prices: an unknown cost is
#     left out, never 0.
#
# WHAT THE ALTS DO FOR A MAIN (alt plan of 2026-10-13, local research notes, wiki-checked):
# they stand in the main's field. Bubbles and fuzz bombs any player can pop
# refill / pollinate the SHARED flowers; the pollen of a bubble goes to its
# owner, but each alt bubble the main pops feeds the main's Pop Star.
