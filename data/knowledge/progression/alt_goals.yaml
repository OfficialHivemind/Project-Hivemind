# HOW BEES ARE MADE. brain/hybrid buys Mythic Eggs until every wanted Mythic
# type is expected to be there: one egg is one of `hatches` (ASSUMED equal odds:
# the wiki says only "always hatches into a Mythic"), so wanting N of the most
# wanted type costs about len(hatches) x N eggs, and the other wanted types come
# along in the same eggs. That is why a hybrid of Fuzzy + Tad costs less than
# both alone.
bee_sources:
  mythic_egg:
    label: Mythic Egg
    cost:
      tickets: 2500
    fact: MEASURED 2026-10-26 (w_ticket_tent) price; ASSUMED equal odds per type
    hatches: [buoyant, fuzzy, precise, spicy, tadpole, vector]
    hatches_fact: MEASURED 2026-10-26 (w_mythic) the six types; Digital Bee is made from drives, not eggs
    why: The cheapest honest Mythic. Royal Jelly is 1 in 25,000 for any Mythic (w_jelly), a Diamond Egg 5% for
      400 tickets = 8,000 tickets a Mythic. Free eggs (Commando 50th capture, quest milestones) come on top.
    source: [w_ticket_tent, w_egg, w_mythic, w_jelly]
  star_treat:
    label: Star Treat
    cost:
      tickets: 1000
    fact: MEASURED 2026-10-26 (w_star_treat, w_ticket_tent)
    why: The only treat that always makes a bee gifted. Feed it AFTER the egg (an egg on a gifted bee replaces it).
    source: [w_star_treat, w_ticket_tent]

