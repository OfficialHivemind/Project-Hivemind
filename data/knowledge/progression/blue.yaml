# NORMALISED 2026-10-14 from a research file (local research notes, not shipped)
# for brain/progression: ids as in goals.yaml (hive_slot<=N, silver_star_amulet,
# science_translator_1), a short `label` and a gear `slot` per goal, costs as
# numbers (an unknown cost is left out, never 0). Sources kept as researched.
#
# Bee Swarm Simulator -- BLUE HIVE progression, fresh account to endgame.
# Research of 2026-10-14 for Hivemind's planner.
#
# HOW TO READ
#   * Every fact carries `source:` ids from `sources` below. Wiki pages were read
#     through api.php (action=parse, prop=wikitext) on 2026-10-14; the wiki's newest
#     listed update is 2026-06-08 (Beesmas 2025 removed), so prices are current as
#     far as the wiki knows. Read the price on the shop screen before buying.
#   * "GUESS:" marks our inference; "DISAGREE:" marks sources that conflict.
#   * Goal ids reuse data/knowledge/goals.yaml where they exist (porcelain_dipper,
#     porcelain_port_o_hive, honey_mask, bubble_mask, honeycomb_belt, cobalt_guard,
#     crimson_guard, diamond_mask). `hive_slot_to_N` = goals.yaml `hive_slot<=N`.
#   * Hive slot prices are the wiki's table (data/knowledge/hive_slots.yaml).
#   * Stage boundaries are ours, built from the guides: the AG guide's own stages 1-4
#     all start AFTER a Supreme Star Amulet (SSA); the pre-SSA part comes from
#     itemlevel/meta-bee guides and the wiki.
#
# A TYPICAL ACCOUNT AT THE END OF `mid`: blue, about 40 bees, no SSA yet. The binding
#    gates ahead are (1) 40 GIFTED TYPES for the SSA, (2) Science Bear's translator for
#    Bucko quests, (3) badges (Spirit Bear needs 15 Ace then 10 Master for the first
#    Spirit Petal).

