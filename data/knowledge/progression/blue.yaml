mistakes:
- 'Buying the Spark Staff: community skips it straight from the Golden Rake to the Porcelain Dipper (progression.yaml
  quotes).'
- 'Hatching Diamond Eggs: the Diamond Mask needs 5; buying them costs 400 tickets each.'
- 'Using Royal Jelly hoping for mythics: 1/25,000 per jelly; Mythic Eggs (2,500 tickets) or Diamond Eggs (5% mythic)
  are the route.'
- 'Using an RJ or egg on a gifted or mutated bee: it almost always loses gifted/mutation.'
- 'Wearing Hiking Boots instead of Beekeeper''s Boots while farming: Hiking gives no gather pollen; Beekeeper''s
  gives +27% (keep Hiking only to enter Dapper Bear''s shop).'
- Buying hive slots 43-45 (4.5-20B each, ~+1-2.5% each) before the Honeycomb Belt, Cobalt Guard and Diamond Mask
  (bot payback study).
- 'Running Mondo Chick kills in the macro: costs a gather each hour (AG: always off).'
- 'Not doing Polar Bear early: Polar Power and Quest badges are permanent capacity/energy; AG: ''start macroing
  polar now''.'
- 'Gathering in Pepper/Coconut/Mountain Top as a blue hive: 0%/4%/33% blue.'
- 'Gathering in Stump while the Stump Snail lives: bees fight it instead of gathering.'
- 'Letting the bag die in Pine Tree: Mantises + Werewolf; a death drops the whole bag (fields.yaml).'
- 'Spending Star Eggs early: they skip gifted mythics until every other non-event gifted type is in the hive --
  hatch late (itemlevel).'
- 'Running Shy/Lion/Frosty/Cobalt in a post-SSA comp: a Diamond makes more honey in that slot
  (AG). Pre-SSA they are still worth gifting for the type count.'
- 'Trusting AI-written ''wiki'' sites (bee-swarm-simulator.wiki, ggwtb.com, bluehiveguide.com, ofzenandcomputing,
  rosenberryrooms): they invent mechanics (e.g. a ''Supreme Sprout'' that gives the SSA).'
