stages:
- id: early
  name: Early -- fresh account to 25 bees (starter zone up to the Honey Bee Gate)
  enter_when:
    bees: 1
    honey: 0
  goals:
  - id: basic_eggs_to_25
    label: 25 bees
    kind: bee
    name: Fill the 25 free slots with Basic Eggs
    cost:
      honey: 0
    requires: []
    why: Bee count opens every gate (5/10/15/25/30/35); Basic Egg starts at 1,000 honey and rises per purchase to
      a 10M cap; 0.4% gifted per hatch.
    priority: 1
    source:
    - w_eggs
    - w_gates
  - id: black_bear_egg_chains
    label: Black Bear's egg quests
    kind: quest
    name: Black Bear chains to Silver (6), Gold (9), Diamond (20) Egg
    cost: {}
    requires: []
    why: Pure pollen quests that pay eggs = bees; the cheapest bees in the game.
    priority: 1
    source:
    - w_q_black
  - id: tool_ladder_early
    label: Noob/Pro Shop tools
    kind: gear
    slot: tool
    name: 'Tool ladder: Rake 800 > Clippers 2,200 > Magnet 5,500 > Vacuum 14,000 > (Pro Shop) Super-Scooper 40k
      > Pulsar 125k > Electro-Magnet 300k > Scissors 850k'
    cost:
      honey: 1337500
    requires:
    - Pro Shop items after the 10-bee Brave Bee Gate (itemlevel; GUESS for exact gate)
    why: Tool pollen is most of early income; Clippers/Scissors also cut the Commando Chick vines.
    priority: 2
    source:
    - w_tools
    - w_noob_pro
    - itemlevel_order
  - id: bag_ladder_early
    label: Noob/Pro Shop bags
    kind: gear
    slot: bag
    name: 'Bag ladder: Jar 650 > Backpack 5,500 > Canister 22k > Mega-Jug 50k > Compressor 160k > Elite Barrel 650k
      > Port-O-Hive 1.25M'
    cost:
      honey: 2138150
    requires: []
    why: Capacity sets trip length; buy the next bag as soon as the bag fills faster than the walk.
    priority: 2
    source:
    - w_noob_pro
  - id: basic_boots
    label: Basic Boots
    kind: gear
    slot: boots
    name: Basic Boots
    cost:
      honey: 4400
      items:
        sunflower_seed: 3
        blueberry: 3
    requires: []
    why: Early movespeed; itemlevel says prioritise for movement.
    priority: 3
    source:
    - w_noob_pro
    - itemlevel_order
  - id: bubble_wand
    label: Bubble Wand
    kind: gear
    slot: tool
    name: Bubble Wand (Blue HQ)
    cost:
      honey: 3500000
    requires:
    - 4 blue bee types discovered (Blue HQ door)
    why: 'First blue tool: 6 pollen x 16 patches / 0.8 s, x2 on blue = ~240/s blue. Best blue tool until the Porcelain
      Dipper.'
    priority: 2
    source:
    - w_blue_hq
    - w_items
    - itemlevel_order
  - id: blue_port_o_hive
    label: Blue Port-O-Hive
    kind: gear
    slot: bag
    name: Blue Port-O-Hive (Blue HQ)
    cost:
      honey: 12500000
      items:
        blue_extract: 2
        soft_wax: 2
    requires:
    - 4 blue bee types discovered
    why: '+400k capacity, +10% blue pollen, +10% instant blue conversion: the blue bag until Porcelain.'
    priority: 2
    source:
    - w_blue_hq
  - id: parachute
    label: Parachute
    kind: gear
    slot: glider
    name: Parachute (Pro Shop)
    cost:
      honey: 500000
    requires: []
    why: 'Needed for many RJ/ticket tokens and shortcuts; itemlevel says skip it for the Glider later. DISAGREE:
      cheap enough to just buy.'
    priority: 4
    source:
    - w_items
    - itemlevel_order
  - id: blue_guard
    label: Elite Blue Guard
    kind: gear
    slot: right_guard
    name: Blue Guard then Elite Blue Guard (Blue HQ, right shoulder)
    cost:
      honey: 6000000
      items:
        blueberry: 100
        royal_jelly: 6
        moon_charm: 18
        blue_extract: 3
    requires:
    - 4 blue bee types
    why: '+25k/+75k capacity, +15%/+25% blue pollen. DISAGREE: itemlevel says skip guards early as not cost-effective.'
    priority: 4
    source:
    - w_blue_hq
    - itemlevel_order
  - id: silver_soakers
    label: Silver Soakers
    kind: gear
    slot: sprinkler
    name: Basic Sprinkler (10 Cadet badges) then Silver Soakers (10 Hotshot badges)
    cost:
      honey: 23333333
    requires:
    - 15 badges to enter the Guild
    - 10 Cadet / 10 Hotshot badges
    why: Sprinklers regrow flowers in the gather field; Silver Soakers = 2 sprinklers.
    priority: 3
    source:
    - w_guild
  fields:
  - field: sunflower
    why: Starter field next to the hive, no mobs; first quests (70% white).
    source:
    - w_q_black
  - field: blue_flower
    why: First blue field, 0 bees, 731 flowers 70% blue / 30% white, one lvl-1 Rhino Beetle; Blue HQ is behind it;
      King Beetle's Lair entrance is in its wall.
    source:
    - w_fields
  - field: bamboo
    why: 5 bees; 75% blue, mostly double flowers (better than Blue Flower's singles); two Rhino Beetles.
    source:
    - w_fields
  - field: stump
    why: 10 bees; 85% blue, all triple flowers -- but while the Stump Snail lives your bees attack it instead of
      gathering, so early it is a snail fight, not a farm.
    source:
    - w_fields
    - w_mobs
  quests:
  - giver: black_bear
    chain: Silver Egg (6) > Gold Egg (9) > Diamond Egg (20) > Star Jelly (20) > Mythic Egg (Myth In The Making,
      ~75th) > repeatables 1/hour
    why: All pollen; eggs, RJ, tickets; Treats from the Star Jelly chain feed Mother Bear and the Honey Mask.
    source:
    - w_q_black
    - w_eggs
  - giver: mother_bear
    chain: 13 levelling/treat quests; quest 10 'Seven To Seven' gives a Star Egg; finishing all gives a Star Treat
    why: Star Egg + Star Treat = two guaranteed gifted bees.
    source:
    - w_q_other
    - w_eggs
  - giver: science_bear
    chain: 31 quests gated by bee TYPES discovered (5..35); Translators at 21, 26, 31
    why: Translators unlock Bucko (blue extract every quest), Stick Bug, Riley. Mandatory chain per the wiki.
    source:
    - w_q_science
  - giver: panda_bear
    chain: mob-kill quests; 'Colossal Combat' (15) Diamond Egg; 'Royal Rumble' (20) Star Egg; finishing all gives
      a Star Treat
    why: Bees kill these mobs while gathering anyway.
    source:
    - w_q_other
    - w_eggs
  - giver: brown_bear
    chain: 'infinite pollen quests; milestones: 50 Gold Egg, 75 Diamond Egg, 90 Star Jelly, 100/200/400 Mythic Egg,
      750 Star Treat'
    why: Steady eggs and materials for work the farm does anyway.
    source:
    - w_q_other
    - w_eggs
  - giver: honey_bee
    chain: 'Honey Hunt: 500 x n honey tokens; Star Jelly every 10 quests up to 100'
    why: Free Star Jellies = gifted bees.
    source:
    - w_jelly
    - w_q_other
  bees:
  - bee: any_blue_rare_epic
    why: Discovering blue TYPES opens the Blue HQ (4 types) and Science Bear's gates; keep Bubble/Bucko/Bumble/Cool,
      roll red ones later.
    gifted_priority: 2
    source:
    - w_blue_hq
    - w_q_science
  - bee: bubble
    why: Epic blue; Blue Bomb + gathering bubbles; gifted x1.25 bubble pollen. The early-blue placeholder for Tadpoles/Buoyants.
    gifted_priority: 2
    source:
    - w_bees
    - ag_guide
  - bee: bucko
    why: Epic blue; Blue Boost (x1.2 blue pollen, 10 stacks); gifted +20% blue field capacity.
    gifted_priority: 2
    source:
    - w_bees
  tips:
  - 'Join the free Bee Swarm Simulator Club group: unlocks the Honey/Treat/Strawberry/Blueberry dispensers and is
    required for Science Bear''s ''The Power of Information'' (account.yaml; wiki Science Bear).'
  - Use Royal Jelly on BASIC bees only until rares are gone; RJ odds are ~70% rare, 27% epic, 3% legendary, 1/250
    gifted, 1/25,000 mythic -- it never rolls an event bee.
  - Wealth Clock hourly (1,2,3,4,5 tickets in an unbroken session) is the main free ticket source.
  - 'Kill King Beetle daily from ~15 bees: 2,500 HP, first kill 100 treats + RJ, 1/7 King Beetle Amulet.'
