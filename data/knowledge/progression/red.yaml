# NORMALISED 2026-10-14 from a research file (local research notes, not shipped)
# for brain/progression: ids as in goals.yaml (hive_slot<=N, silver_star_amulet,
# science_translator_1), a short `label` and a gear `slot` per goal, costs as
# numbers (an unknown cost is left out, never 0). Sources kept as researched.
#
# RED HIVE PROGRESSION, fresh account to endgame, for Hivemind to plan with.
# Research only (2026-10-14).
#
# CONVENTIONS
#   * Every goal names its source ids (see `sources`). A line marked GUESS is
#     ours, not a source's. A line marked DISAGREE lists both sides.
#   * Prices are the wiki's (bee-swarm-simulator.fandom.com via api.php, read
#     2026-10-14). The wiki can lag the game: read the shop screen before buying.
#   * ids reuse goals.yaml / gear_prices.yaml / progression.yaml where they exist
#     (crimson_guard, honey_mask, porcelain_dipper, porcelain_port_o_hive,
#     honeycomb_belt, red_port_o_hive, fire_mask, demon_mask, riley_guard,
#     elite_red_guard, red_guard, beekeepers_mask, beekeepers_boots,
#     mondo_belt_bag, glider, coconut_canister, coconut_clogs, gummy_boots,
#     petal_belt, coconut_belt, golden_gushers, silver_soakers, *_star_amulet,
#     scythe, golden_rake, petal_wand, dark_scythe). Hive slots use goals.yaml's
#     "hive_slot<=N" form (brain/goals with_next_slot). Material names follow
#     goals.yaml `materials` (singular snake_case).
#   * priority: 1 = do first / matters most, 5 = optional.
#
# THE ONE THING EVERY SOURCE AGREES ON: a true red hive (Precise + Spicy +
# Vector, Scorching Star, Dark Scythe) is an ENDGAME build. Before ~45 bees and
# a Supreme Star Amulet, "red" means a red-leaning mixed hive farming red fields
# with red gear; most guides would even say go blue first (itemlevel_order
# recommends blue first; disc_early_2025; bswiki_red). The stages
# below follow that: early/mid buy the cheap red items and do Riley's quests,
# late banks for the switch, endgame is the real red hive.

