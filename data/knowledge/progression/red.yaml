stages:
- id: early
  name: 'Fresh account to 25 bees: starter gear, find 4 red bee types, open the Red HQ'
  enter_when:
    bees: 0
    honey: 0
    gear: []
  goals:
  - id: noob_shop_basics
    label: Noob Shop basics
    kind: gear
    name: 'Noob Shop ladder: Backpack + Clippers first, then Basic Boots, then best tool/bag in the shop (Vacuum
      14k, Canister 22k)'
    cost:
      honey: 14000
      tickets: 0
    requires: []
    why: Bag and tool are the whole early economy; boots speed every quest walk.
    priority: 1
    source:
    - itemlevel_order
  - id: pro_shop_ladder
    label: Pro Shop ladder
    kind: gear
    name: 'Pro Shop ladder (10 bees): up to Scissors 850k / Port-O-Hive 1.25M, Belt Bag, Hiking Boots; skip the
      Parachute'
    cost:
      honey: 1250000
      tickets: 0
    requires:
    - bees>=10
    why: Next tool/bag tier; itemlevel says skip the parachute.
    priority: 1
    source:
    - itemlevel_order
  - id: discover_4_red_types
    label: Discover 4 red bee types
    kind: bee
    name: Discover 4 red bee types (Rad, Rascal, Riley, Rage, Fire, Demon, Shy, Precise, Spicy, Crimson, Festive)
    cost:
      honey: 0
      tickets: 0
    requires: []
    why: 'Red HQ door needs 4 red types; its Red Field Booster needs 5. GUESS: use eggs/RJ until they land; nothing
      guarantees a colour.'
    priority: 1
    source:
    - wiki_red_hq
    - wiki_red_booster
  - id: scythe
    label: Scythe
    kind: gear
    slot: tool
    name: Scythe (Red HQ)
    cost:
      honey: 3500000
      tickets: 0
    requires:
    - discover_4_red_types
    why: x2 on red flowers, every 20th swing spawns a flame (Flame Heat); also needed for quests.
    priority: 2
    source:
    - wiki_scythe
    - itemlevel_order
  - id: red_port_o_hive
    label: Red Port-O-Hive
    kind: gear
    slot: bag
    name: Red Port-O-Hive (Red HQ)
    cost:
      honey: 12500000
      tickets: 0
      items:
        red_extract: 2
        soft_wax: 2
    requires:
    - discover_4_red_types
    why: +400k capacity, +150% convert rate, +10% instant red conversion, +10% red pollen.
    priority: 1
    source:
    - wiki_red_port
    - wiki_red_hq
  - id: red_guard
    label: Red Guard
    kind: gear
    slot: left_guard
    name: Red Guard (left shoulder) -- or go straight to Elite Red Guard
    cost:
      honey: 750000
      tickets: 0
      items:
        strawberry: 50
        royal_jelly: 1
        stinger: 1
    requires:
    - discover_4_red_types
    why: +25k capacity, +10% red pollen, +1 red bee attack; cheap stepping stone.
    priority: 4
    source:
    - wiki_red_hq
  - id: elite_red_guard
    label: Elite Red Guard
    kind: gear
    slot: left_guard
    name: Elite Red Guard (left shoulder)
    cost:
      honey: 5000000
      tickets: 0
      items:
        red_extract: 3
        strawberry: 50
        royal_jelly: 5
        stinger: 5
    requires:
    - discover_4_red_types
    why: +75k capacity, +25% red pollen, +5% crit chance; itemlevel says skip guards this early -- buy only if honey
      is idle.
    priority: 4
    source:
    - wiki_red_hq
    - itemlevel_order
  - id: science_translator_1
    label: Science Bear's first Translator
    kind: quest
    name: 'Science Bear: Initial 16 quests, then Translator quest 5 ''Limits of Language'' (1st Translator)'
    cost:
      honey: 0
      tickets: 0
    requires: []
    why: The translator is the key to Gifted Riley Bee, the red questline that pays a Red Extract every quest.
    priority: 1
    source:
    - wiki_quests
  - id: badges_15
    label: Earn 15 badges
    kind: badge
    name: Earn 15 badges (Badge Bearer's Guild; sprinkler shop)
    cost:
      honey: 0
      tickets: 0
    requires: []
    why: Opens the Guild's Sprinkler Shop and, with 1 Ace badge, the Ace Shop (Crimson Guard later).
    priority: 3
    source:
    - itemlevel_order
  fields:
  - field: mushroom
    why: Starting red field, no gate; only a level 1 ladybug; drops strawberries (1 in 12) and treats; Riley 'Mushrooms'/'Picnic'
      quests use it.
    source:
    - wiki_fields
    - wiki_gifted_riley
  - field: strawberry
    why: 5-bee red field, 572 flowers red+white; strawberries and red extract tokens; ladybugs only (lvl 2-3). Strawberries
      feed red bees and make Red Extract.
    source:
    - wiki_fields
    - wiki_red_extract
  - field: sunflower
    why: No mobs, next to the hive -- the safe early field (fields.yaml); white, so Scythe gets no bonus there.
    source:
    - wiki_fields
  quests:
  - giver: black_bear
    chain: Silver Egg (6) -> Gold Egg (9) -> Diamond Egg (20) -> Star Jelly (20) -> Mythic Egg (20), then repeatables
    why: Pollen-only quests; eggs = bees = gates.
    source:
    - wiki_quests
    - itemlevel_order
  - giver: mother_bear
    chain: Mother Bear chain (bee levels, treats)
    why: Levels and eggs; her Star Treat later gifts Tabby.
    source:
    - wiki_quests
    - disc_progression_2022
  - giver: brown_bear
    chain: Infinite repeatable
    why: Every quest pays a ticket + royal jelly + honey.
    source:
    - wiki_quests
  - giver: science_bear
    chain: 'Initial (16) then Translator list (15): translators at #5, #10, #15'
    why: Translators unlock the quest bees; Riley's is the red one.
    source:
    - wiki_quests
  - giver: polar_bear
    chain: Random pollen/mob quests
    why: Main early bear per the 2022 guide.
    source:
    - disc_progression_2022
  bees:
  - bee: rad
    why: 'Red rare, Red Boost tokens; gifted x1.1 red pollen (the 2024 thread: made a multiplier, now run in red
      hives).'
    gifted_priority: 3
    source:
    - wiki_bees
    - disc_best_build_2024
  - bee: riley
    why: Red epic, Red Boost; gifted +20% red field capacity ('a must have' for red's weak capacity).
    gifted_priority: 2
    source:
    - wiki_bees
    - disc_best_build_2024
  - bee: rage
    why: Red epic, Rage + Token Link; gifted +10% bee attack.
    gifted_priority: 3
    source:
    - wiki_bees
    - fanon_red
  - bee: rascal
    why: Red rare, Red Bomb; gifted x1.25 red bomb pollen. Counts toward the 4 red types.
    gifted_priority: 4
    source:
    - wiki_bees
  - bee: baby
    why: 'Baby Love; 2022 guide: 1-2 in every hive; gifted +25% loot luck.'
    gifted_priority: 3
    source:
    - disc_progression_2022
    - wiki_bees
  tips:
  - Red HQ needs 4 discovered red types, the Red Field Booster 5, Gifted Riley Bee 15 bees + 4 red types + a Translator
    (wiki_red_hq, wiki_gifted_riley).
  - Do Black/Mother/Polar/Science Bear quests in the background; save Diamond Eggs and gifted eggs, never hatch
    them into the hive (disc_progression_2022).
  - 'Keep fruit (strawberries, pineapples, sunflower seeds) for the Blender rather than feeding everything (itemlevel_mid):
    50 Strawberry + 10 RJ = 1 Red Extract (wiki_red_extract).'
