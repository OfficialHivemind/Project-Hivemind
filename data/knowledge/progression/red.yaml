  tips:
  - 'Boost routine (fanon_red, ffbooyah_red, metabee_red): Glitter first; Purple Potion to the Wind Shrine for winds;
    stack Precision to x10; Loaded Dice only once close to Scorching Star with 3 Precise Marks down; hold x10 red
    boost; get Scorching Star to 6k+ fast; SPAM precise marks; don''t move too fast or bees stop spawning tokens.'
  - 'Nectar priority for red boosts (metabee_red): Invigorating > Refreshing > Satisfying > Motivating > Comforting.
    Natro fields: Invigorating = Pepper, Mountain Top, Clover, Cactus; Motivating = Mushroom, Rose, Stump, Spider;
    Refreshing = Strawberry, Coconut, Blue Flower.'
  - 'Mutations: Precise movespeed/attack/crit; Spicy attack (metabee) or convert amount (fanon); Vector movespeed
    > ability rate; Digital gather amount %; everyone else +5 movespeed or ability rate (metabee_red, fanon_red,
    disc_best_build_2024).'
  - Convert mutations beat gather mutations because they help Flame Fuel convert more (noks_doc).
  - Toy Drum and Electric Candle are Beesmas beequips now obtainable only by trading (wiki_beequips) -- a bot cannot
    trade, so plan comps that work without them.
  - 'Top boosting assumes 4-6 helper/alt accounts with Coconut Belts for coco combos (ofzen_red, metabee_red); a
    single account without alts should expect solo numbers well below the guides''.'
mistakes:
- 'Switching to red too early: every source says build/profit blue (or mixed) first and switch at ~45 bees with
  SSA Scorching Star, or later (itemlevel_order, disc_early_2025, bswiki_red, metabee_red: not before
  level 20).'
- 'Giving the first Translator to Stick Bug or Bucko when going red: the 2022 guide says Riley first (DISAGREE:
  itemlevel orders Bucko > Stick Bug > Riley for a blue-first plan).'
- Hatching Diamond Eggs / gifted eggs / star jelly into the hive before the masks and petals that need them (disc_progression_2022,
  itemlevel_mid).
- Donating the first or second Spirit Petal for Windy Bee (disc_progression_2022, itemlevel_mid).
- Running Demon, Fire or (on main) Fuzzy bees in an endgame red comp (disc_progression_2022, metabee_red).
- 'Turning flames into Dark Flames instantly -- metabee: don''t, so they last longer (note: the wiki says a Dark
  Scythe hit resets lifespan; reconcile in testing).'
- 'Moving too fast while boosting: bees stop spawning tokens (metabee_red, ofzen_red).'
- 'Leaving Precise targets unactivated: each one left becomes a Red Boost token instead of a Focus token + shot;
  activating only the FARTHEST target makes a Precise Mark (gifted Precise only) (wiki_precise).'
- Chasing fruit and loot on a red hive works against red gathering -- fruit/loot chasing and red flame/target
  play don't mix (our reading of the red guides above; not measured).
- 'Farming Rose with a bot that cannot fight: two scorpions + rogue Vicious; Pepper has no mobs (wiki_fields).'
- 'Ignoring capacity: red bags are small compared to blue (bswiki_red ''Capacity Trap''); Riley gifted bonus, Buoyant,
  Scorching Star and Demon Mask are the fixes.'
