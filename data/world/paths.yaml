# Routes transpiled from BeeTuxMacro's recorded timed holds by
# scripts/transpile_paths.py, using studs = seconds x 32.2.
#
# Travel routes come from stuff/paths.sh; the farm_* field patterns
# come from stuff/utils.sh, which is where BeeTuxMacro keeps them.
#
# EVERY EDGE IS `verified: false`. These are someone else's recordings
# at an unknown moment, so the distances are approximate. That is
# tolerable because the walker is closed-loop: it measures real
# displacement and arrival is confirmed by landmark, not by the clock.
# An edge length that is wrong costs a slightly wrong route estimate,
# not a lost character. Edges are re-measured and marked verified as
# the bot actually walks them.
#
# Do not hand-edit: re-run the transpiler.
